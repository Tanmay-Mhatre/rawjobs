<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>RawJobs</title>
    <link rel="icon" type="image/svg+xml" href="/src/design/logos/rawjobs-mark.svg" />
    <script>
      // Pick the theme before first paint so the page never flashes the wrong one. Same rules as
      // resolveTheme() in src/lib/theme.ts: your choice in Settings, otherwise the system setting.
      (function () {
        var theme = null;
        var contrast = null;
        try {
          theme = localStorage.getItem("rawjobs.theme") || localStorage.getItem("jobhunter.theme");
          contrast = localStorage.getItem("rawjobs.contrast");
        } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        var more = contrast === "more" || matchMedia("(prefers-contrast: more)").matches;
        document.documentElement.dataset.theme = (dark ? "dark" : "light") + (more ? "-hc" : "");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
