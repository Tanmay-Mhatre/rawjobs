# RawJobs marketing site: static files, served as static assets (free, and not counted against the
# Workers request quota). The one exception is the job feed's Web Bot Auth key directory, which
# worker.ts signs on each read (run_worker_first below); every other path never runs the Worker.
# Deployed by .github/workflows/site.yml on every push to main. Build first: pnpm site:build
name = "www"
main = "worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/.well-known/http-message-signatures-directory"]
