name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This issue is public: leave out your resume, config, Telegram token and anything else personal.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Companies
        2. Paste https://jobs.lever.co/acme into Add by link
        3. ...
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Installing, updating or uninstalling
        - Web dashboard
        - Command line
        - A hiring system connector (Greenhouse, Workday, ...)
        - Shared directory or job index
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run RawJobs
      options:
        - Installed with the one-line install
        - From the source code (pnpm)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Your operating system (e.g. Windows 11, macOS 15.4). Installed: the RawJobs version from Settings → Updates. From source: `node -v` and `git rev-parse --short HEAD`."
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: "Paste any error text. Installed copies keep logs in the install folder: logs/server.log, and logs/update.log for updates (see docs/install.md). Remove anything personal first."
      render: text
