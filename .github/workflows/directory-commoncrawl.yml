# Every day: read more of our own URL indexes, which the weekly rebuild no longer reads.
# - Common Crawl (our richest board source: one crawl added 16,295 boards no other source had,
#   9,438 of them live): 50 minutes a day, only the 12 newest crawls (about a year).
# - The Wayback Machine's index: 25 minutes on Tuesday, Thursday and Saturday (never Monday, the
#   rebuild's day), gently: one request at a time, 4.5 s apart.
# Both resume per query and stop at once when their index keeps failing. What they find is merged
# and checked by the next contributions run or rebuild. Data · health alerts when Wayback is blocked
# or stops making progress.
# Setup: docs/shared-directory.md
name: Directory · Common Crawl
# Runs the scheduler Worker starts are named so; empty means GitHub's usual name.
run-name: ${{ inputs.source == 'scheduler' && format('{0} · scheduler', github.workflow) || '' }}

on:
  schedule:
    # Between the contributions runs at :17 every 3 hours, and never near Monday's 03:00 rebuild.
    # Takes up to ~2 hours on a Wayback day, so the 15:17 contributions run may queue behind it.
    - cron: "40 13 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this run (the scheduler Worker sends scheduler)"
        type: string
        default: manual

# queue: max — wait behind a running rebuild instead of being cancelled by the next run to queue.
concurrency:
  group: directory
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  # To start an overdue weekly rebuild and keep the schedules on (scripts/catalog/watchdog.sh).
  actions: write
  issues: read

env:
  DATA_REPO: ${{ vars.DATA_REPO || 'Tanmay-Mhatre/rawjobs-directory' }}

jobs:
  # GitHub's cron starts runs late, and a slot can get two triggers (it and the scheduler Worker):
  # a scheduled run whose slot another run already covers does nothing. Other runs always go ahead.
  covered:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/catalog/slot-covered.mjs
            .github/workflows/directory-commoncrawl.yml
          sparse-checkout-cone-mode: false
      - id: check
        name: Is this slot already covered?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          out=$(node scripts/catalog/slot-covered.mjs .github/workflows/directory-commoncrawl.yml runs)
          echo "$out"
          if grep -q '^covered=true' <<< "$out"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: another run already covers this schedule slot."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  read:
    needs: covered
    if: needs.covered.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # Setup ~5 + Common Crawl step 62 + Wayback step 52, with a few minutes to save.
    timeout-minutes: 125
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore the catalog's working state
        id: state
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh restore

      - name: Common Crawl
        if: steps.state.outputs.restored == 'true'
        continue-on-error: true
        timeout-minutes: 62
        run: bash scripts/catalog/capped.sh "Common Crawl" 60 pnpm exec tsx scripts/catalog/commoncrawl.ts --crawls 12 --per-run 2 --max-minutes 50

      - name: Is it a Wayback day?
        id: day
        # Tuesday, Thursday and Saturday (UTC), never Monday.
        run: case "$(date -u +%u)" in 2 | 4 | 6) echo "wayback=true" >> "$GITHUB_OUTPUT" ;; *) echo "wayback=false" >> "$GITHUB_OUTPUT" ;; esac

      # A query in flight can run well past the soft cap (retries on a slow index); wayback.ts saves
      # after every page, so the hard cap loses at most that page.
      - name: Wayback
        if: steps.state.outputs.restored == 'true' && steps.day.outputs.wayback == 'true'
        continue-on-error: true
        timeout-minutes: 52
        run: bash scripts/catalog/capped.sh "Wayback" 50 pnpm exec tsx scripts/catalog/wayback.ts --max-minutes 25

      - name: Save the working state
        if: always() && steps.state.outputs.restored == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh save

      - name: Summary
        if: always() && steps.state.outputs.restored == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(gh run view "${{ github.run_id }}" -R "${{ github.repository }}" --json createdAt -q .createdAt)
          pnpm exec tsx scripts/catalog/tally.ts --since "$since" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the weekly rebuild if it's overdue
        if: always() && steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/catalog/watchdog.sh rebuild

      - name: Keep the schedules alive
        if: always() && steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/catalog/watchdog.sh keepalive
