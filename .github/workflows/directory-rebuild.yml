# Every Monday: rebuild the whole shared directory from the public lists plus users'
# contributions, re-check boards, refresh the job index, and publish a new release.
# Setup: docs/shared-directory.md
#
# Two jobs, each with its own time limit: "collect" gathers and checks boards and saves the working
# state; "publish" restores it, builds, indexes, gates and releases. Publish runs even when collect
# failed or ran out of time (its progress is saved), so a slow source can never stop a release.
# Collectors may also stop early on their own without failing collect: each saves what it found and
# the next run continues. The steps on the publish path (sources, merge, build, package, gate,
# publish) must succeed.
#
# Time budget (minutes; soft cap = the script's --max-minutes, hard cap = capped.sh, which runs it
# under `timeout`):
#
#   stage            soft  hard     stage          soft  hard
#   Common Crawl       35    45     crossprobe       20    25
#   Wayback            45    70     check 2          15    20
#   industry resolve   10    15     index            60    70
#   bulk resolve       45    57     publish job       –   ~35 besides index (setup, sources, merge, build, package, gate, release)
#   check 1            60    70
#
# Set from the first full run (11 Oct 2026: collect 2h02, publish 1 min). Collect's hard caps add
# up to about 335 of its 350; publish's to about 110 of its 120. A typical run takes about 3.5 hours.
# A smoke run (dispatch with smoke) gives every stage 2 minutes, publishes nothing and checks
# that a step past its timeout-minutes fails without stopping the job: about 25 minutes.
name: Directory · weekly rebuild

on:
  schedule:
    # GitHub runs schedules "best effort": on 12 Oct 2026 the Monday 03:00 run never fired. So
    # there are backups; each runs only if no weekly rebuild has published in the last 5 days.
    # Off the hour on purpose: that's when GitHub is busiest.
    - cron: "7 3 * * 1"
    - cron: "37 5 * * 1"
    - cron: "41 9 * * 1"
    - cron: "13 3 * * 2"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Publish even if the directory shrank more than the release gate allows (a deliberate purge)"
        type: boolean
        default: false
      smoke:
        description: "Smoke test: every stage for 2 minutes, nothing published"
        type: boolean
        default: false

concurrency:
  group: directory
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

env:
  DATA_REPO: ${{ vars.DATA_REPO || 'Tanmay-Mhatre/rawjobs-directory' }}

jobs:
  # A scheduled run goes ahead only if no rebuild published in the last 5 days (the backups above);
  # a run started by hand always does.
  due:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Has a rebuild published in the last 5 days?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The weekly rebuild's releases are directory-YYYY-MM-DD; contributions' end in -shared.
          last=$(gh release list -R "$DATA_REPO" --limit 100 --json tagName,publishedAt -q '[.[] | select((.tagName | startswith("directory-")) and (.tagName | endswith("-shared") | not))] | max_by(.publishedAt) | .publishedAt // ""')
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt $(( 5 * 86400 )) ]; then
            echo "This week's rebuild already published ($last); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No rebuild in the last 5 days (last: ${last:-none}); running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CONTRIBUTIONS_FILE: ${{ github.workspace }}/directory-repo/contributions.json
      DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check out the public directory repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: directory-repo

      - name: Restore the catalog's working state
        id: state
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh restore

      - name: Download the public lists
        timeout-minutes: 5
        run: |
          [ -f directory-repo/contributions.json ] || echo '{"companies":[]}' > directory-repo/contributions.json
          pnpm catalog:sources

      # Smoke runs only: prove that a step past its timeout-minutes ends as a failure that
      # continue-on-error absorbs (the collectors rely on it as their last backstop).
      - name: Canary
        id: canary
        if: ${{ inputs.smoke }}
        continue-on-error: true
        timeout-minutes: 1
        run: sleep 120

      - name: Check the canary
        if: ${{ inputs.smoke }}
        run: |
          [ "${{ steps.canary.outcome }}" = failure ] || { echo "::error::A step past its timeout-minutes ended as '${{ steps.canary.outcome }}', not failure."; exit 1; }
          echo "OK: a step past its timeout-minutes fails, and continue-on-error keeps the job going."

      # Our own URL lists: new Common Crawl crawls, and the next stretch of the Wayback index.
      - name: Common Crawl
        id: commoncrawl
        continue-on-error: true
        timeout-minutes: 47
        run: bash scripts/catalog/capped.sh "Common Crawl" ${{ inputs.smoke && 5 || 45 }} pnpm exec tsx scripts/catalog/commoncrawl.ts --crawls 12 --per-run 1 --max-minutes ${{ inputs.smoke && 2 || 35 }}

      - name: Wayback
        id: wayback
        continue-on-error: true
        timeout-minutes: 72
        # A query in flight can run ~22 min past the soft cap (retries on a slow index).
        run: bash scripts/catalog/capped.sh "Wayback" ${{ inputs.smoke && 10 || 70 }} pnpm exec tsx scripts/catalog/wayback.ts --max-minutes ${{ inputs.smoke && 2 || 45 }}

      # Company-first: industry seeds, then the next batch of Wikidata companies (the coverage sample).
      - name: Resolve industry seeds
        id: seeds
        continue-on-error: true
        timeout-minutes: 17
        run: bash scripts/catalog/capped.sh "Industry seeds" ${{ inputs.smoke && 5 || 15 }} pnpm exec tsx scripts/catalog/resolve.ts --max-minutes ${{ inputs.smoke && 2 || 10 }}

      - name: Resolve Wikidata companies
        id: bulk
        continue-on-error: true
        timeout-minutes: 59
        run: bash scripts/catalog/capped.sh "Wikidata companies" ${{ inputs.smoke && 8 || 57 }} bash -c "pnpm exec tsx scripts/catalog/seeds-bulk.ts && pnpm exec tsx scripts/catalog/resolve.ts --bulk --limit ${{ inputs.smoke && 20 || 1500 }} --max-minutes ${{ inputs.smoke && 2 || 45 }}"

      - name: Merge
        timeout-minutes: 5
        run: pnpm exec tsx scripts/catalog/merge.ts

      - name: Check boards
        id: check1
        continue-on-error: true
        timeout-minutes: 72
        run: bash scripts/catalog/capped.sh "Check boards" ${{ inputs.smoke && 5 || 70 }} pnpm exec tsx scripts/catalog/check.ts --recheck-days 30 --max-minutes ${{ inputs.smoke && 2 || 60 }}

      # Known companies tried on other systems (needs fresh check results), then merge and check what it found.
      - name: Cross-probe
        id: crossprobe
        continue-on-error: true
        timeout-minutes: 27
        run: bash scripts/catalog/capped.sh "Cross-probe" ${{ inputs.smoke && 5 || 25 }} pnpm exec tsx scripts/catalog/crossprobe.ts --max-minutes ${{ inputs.smoke && 2 || 20 }}

      - name: Merge again
        timeout-minutes: 5
        run: pnpm exec tsx scripts/catalog/merge.ts

      - name: Check new boards
        id: check2
        continue-on-error: true
        timeout-minutes: 22
        run: bash scripts/catalog/capped.sh "Check new boards" ${{ inputs.smoke && 5 || 20 }} pnpm exec tsx scripts/catalog/check.ts --recheck-days 30 --max-minutes ${{ inputs.smoke && 2 || 15 }}

      - name: Save the working state
        # Also after a failure or timeout, so progress isn't lost; but never when the restore failed,
        # or a run that started from nothing would overwrite good state.
        if: always() && steps.state.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh save

  publish:
    needs: collect
    # Also when collect failed or hit its time limit: its progress was saved, and the release gate
    # decides whether the result is good enough to ship. (Cancelling the run by hand doesn't stop
    # this job; cancel it again once it starts.)
    if: always() && needs.collect.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CONTRIBUTIONS_FILE: ${{ github.workspace }}/directory-repo/contributions.json
      DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check out the public directory repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: directory-repo

      - name: Restore the working state collect saved
        id: state
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh restore

      # merged.json isn't part of the saved state: merge again from the lists and saved results.
      - name: Download the public lists
        timeout-minutes: 5
        run: |
          [ -f directory-repo/contributions.json ] || echo '{"companies":[]}' > directory-repo/contributions.json
          pnpm catalog:sources

      - name: Merge
        timeout-minutes: 5
        run: pnpm exec tsx scripts/catalog/merge.ts

      - name: Build
        timeout-minutes: 5
        run: pnpm exec tsx scripts/catalog/build.ts

      - name: Index open jobs
        id: index
        continue-on-error: true
        timeout-minutes: 72
        run: bash scripts/catalog/capped.sh "Index open jobs" ${{ inputs.smoke && 5 || 70 }} pnpm exec tsx scripts/catalog/index.ts --max-age-days 7 --max-minutes ${{ inputs.smoke && 2 || 60 }}

      - name: Package
        timeout-minutes: 10
        run: |
          pnpm exec tsx scripts/catalog/publish.ts --data dist-data
          pnpm exec tsx scripts/catalog/coverage.ts --data dist-data
          pnpm exec tsx scripts/catalog/release.ts --data dist-data --out dist

      - name: Release gate
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
        run: bash scripts/catalog/gate.sh

      - name: Publish the release
        id: publish
        if: ${{ !inputs.smoke }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          day=$(date -u +%Y-%m-%d)
          tag="directory-$day"
          # A second run on the same day gets its own release instead of failing on the tag.
          if gh release view "$tag" -R "$DATA_REPO" > /dev/null 2>&1; then tag="$tag-$(date -u +%H%M)"; fi
          version=$(jq -r .version dist/manifest.json)
          companies=$(jq -r .companies dist/manifest.json)
          # gh creates the release as a draft, uploads every file, then publishes it, so no install
          # ever sees a latest release with files missing.
          gh release create "$tag" dist/* -R "$DATA_REPO" --latest --title "Directory $day" \
            --notes "Version $version · $companies companies. Download manifest.json first; files are checked against its SHA-256."

      - name: Save the working state
        # Also after a failure or timeout, so progress isn't lost; but never when the restore failed,
        # or a run that started from nothing would overwrite good state.
        if: always() && steps.state.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh save

      - name: Commit the coverage report
        if: ${{ !inputs.smoke }}
        working-directory: directory-repo
        run: |
          cp ../scripts/catalog/out/coverage.md coverage.md
          cp ../dist/manifest.json manifest.json
          git config user.name "rawjobs-bot"
          git config user.email "rawjobs-bot@users.noreply.github.com"
          git add coverage.md manifest.json
          git diff --cached --quiet || (git commit -m "Weekly directory $(date -u +%Y-%m-%d)" && git push)

      - name: Report a run that didn't publish
        # Keyed on the publish step, not on failure()/cancelled(): a timeout, a failed step and a
        # refused release all land here.
        if: always() && steps.publish.outcome != 'success' && !inputs.smoke
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOMES: ${{ toJSON(steps) }}
          COLLECT: ${{ needs.collect.result }}
        run: |
          title="Directory rebuild did not publish"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          steps=$(printf -- '- collect job: %s\n%s' "$COLLECT" "$(echo "$OUTCOMES" | jq -r 'to_entries | map("- \(.key): \(.value.outcome)") | join("\n")')")
          body=$(printf 'The weekly rebuild ended without a new release. Installs keep the current one.\n\nRun: %s\n\nSteps:\n%s\n\nIf the release gate refused a deliberate shrink, re-run with: gh workflow run directory-rebuild.yml -f allow_shrink=true' "$run_url" "$steps")
          open=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" -R "${{ github.repository }}" --body "$body"; else gh issue create -R "${{ github.repository }}" --title "$title" --body "$body"; fi

      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          echo "$OUTCOMES" | jq -r 'to_entries[] | select(.key != "canary" and .value.outcome == "failure" and .value.conclusion == "success") | "::warning::\(.key) did not finish; the rebuild went on without it."'
          {
            echo "### Weekly rebuild${{ inputs.smoke && ' (smoke test)' || '' }}"
            echo
            echo "| Step | Result | Minutes |"
            echo "|---|---|---|"
            gh run view "${{ github.run_id }}" -R "${{ github.repository }}" --json jobs -q '.jobs[] | select(.name == "collect" or .name == "publish") | .name as $job | .steps[] | select(.conclusion != null and .conclusion != "" and (.completedAt | startswith("0001") | not)) | "| \($job): \(.name) | \(.conclusion) | \((((.completedAt | fromdate) - (.startedAt | fromdate)) / 60) | floor) |"' || echo "| (step times unavailable) | | |"
            echo
            live="${RUNNER_TEMP}/live-manifest.json"
            if [ -s "$live" ]; then echo "Live release: $(jq -r '"\(.companies) companies, \(.indexed) indexed"' "$live")."; fi
            if [ -f dist/manifest.json ]; then echo "This run's directory: $(jq -r '"\(.companies) companies, \(.indexed) indexed"' dist/manifest.json)."; fi
          } >> "$GITHUB_STEP_SUMMARY"
