# Every Monday: rebuild the whole shared directory from the public lists plus users'
# contributions, re-check boards, refresh the job index, and publish a new release.
# Setup: docs/shared-directory.md
#
# Jobs, each with its own time limit: "resolve" (company-first resolving) and "check-known" (the
# monthly check of known boards, then the cross-probe) run at the same time and hand their files to
# "collect", which merges, checks the boards this week found and saves the working state; "build"
# restores it, builds, indexes and gates; "sign" (the data key, nothing else) signs the manifest; and
# "publish" (the data repo's token, no install) releases it and saves the state. Collect and publish run even when an earlier job
# failed or ran out of time (its progress is kept), so a slow source can never stop a release.
# Collectors may also stop early on their own without failing collect: each saves what it found and
# the next run continues. The steps on the publish path (sources, merge, build, package, gate,
# publish) must succeed.
#
# Time budget (minutes; soft cap = the script's --max-minutes, hard cap = capped.sh, which runs it
# under `timeout`):
#
#   job          stage              soft  hard
#   resolve      industry resolve     10    15     (job limit 110)
#                bulk resolve         45    57
#                own careers sites    15    20
#   check-known  check 1              60    70     (job limit 110)
#                crossprobe           20    25
#   collect      check 2              25    30     (job limit 120)
#   build        index                60    70     (job limit 120; ~35 besides index: setup, sources,
#                                                   visa registers ≤10, merge, build, package, gate, release)
#
# Our own URL indexes (Common Crawl, Wayback) are read by the daily URL-index run
# (directory-commoncrawl.yml), not here. Run times: 2h48 with the URL indexes in it (19 Oct 2026),
# 1h52 without them and before the two stage-1 jobs ran side by side (22 Oct).
# A smoke run (dispatch with smoke) gives every stage 2 minutes, publishes nothing and checks
# that a step past its timeout-minutes fails without stopping the job: about 25 minutes.
name: Directory · weekly rebuild
# Runs the scheduler Worker starts are named so; empty means GitHub's usual name.
run-name: ${{ inputs.source == 'scheduler' && format('{0} · scheduler', github.workflow) || '' }}

on:
  schedule:
    # GitHub runs schedules "best effort": on 12 Oct 2026 the Monday 03:00 run never fired. So
    # there are backups; each runs only if no weekly rebuild has published in the last 5 days.
    # The other scheduled directory workflows also start it when it's overdue (scripts/catalog/watchdog.sh).
    # Off the hour on purpose: that's when GitHub is busiest.
    - cron: "7 3 * * 1"
    - cron: "37 5 * * 1"
    - cron: "41 9 * * 1"
    - cron: "13 3 * * 2"
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this run (the scheduler Worker sends scheduler)"
        type: string
        default: manual
      allow_shrink:
        description: "Publish even if the directory shrank more than the release gate allows (a deliberate purge)"
        type: boolean
        default: false
      smoke:
        description: "Smoke test: every stage for 2 minutes, nothing published"
        type: boolean
        default: false
      due_only:
        description: "Run only if no rebuild published in the last 5 days, like a scheduled run (for the scheduler Worker)"
        type: boolean
        default: false

# Workflow-level on purpose: per job, another run could take the group between collect and publish.
# queue: max — waiting runs queue up instead of the default, where a newer one cancels the waiting one.
concurrency:
  group: directory
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  issues: write
  # Read the run's own step times; start the site deploy after publishing.
  actions: write

env:
  DATA_REPO: ${{ vars.DATA_REPO || 'Tanmay-Mhatre/rawjobs-directory' }}

jobs:
  # A scheduled run (or one dispatched with due_only) goes ahead only if no rebuild published in the
  # last 5 days (the backups above); a run started by hand always does.
  due:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Has a rebuild published in the last 5 days?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != schedule ] && [ "${{ inputs.due_only }}" != true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The weekly rebuild's releases are directory-YYYY-MM-DD; contributions' end in -shared.
          last=$(gh release list -R "$DATA_REPO" --limit 100 --json tagName,publishedAt -q '[.[] | select((.tagName | startswith("directory-")) and (.tagName | endswith("-shared") | not))] | max_by(.publishedAt) | .publishedAt // ""')
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt $(( 5 * 86400 )) ]; then
            echo "This week's rebuild already published ($last); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No rebuild in the last 5 days (last: ${last:-none}); running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Stage 1, two jobs at once: company-first resolving, and the monthly check of known boards then
  # the cross-probe (which needs fresh checks). Each restores the state, never saves it, and hands
  # its files to collect, the one job that saves (state.sh keeps one tarball).
  resolve:
    needs: due
    if: needs.due.outputs.run == 'true'
    # Secrets come from the `data-repo` environment (main only). A test run on another branch gets
    # none and reads with github.token, so it can't publish.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'data-repo' || '' }}
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore the catalog's working state
        id: state
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN || github.token }}
        run: bash scripts/catalog/state.sh restore

      # Industry seeds, then the next batch of Wikidata companies (the coverage sample).
      - name: Resolve industry seeds
        id: seeds
        continue-on-error: true
        timeout-minutes: 17
        run: bash scripts/catalog/capped.sh "Industry seeds" ${{ inputs.smoke && 5 || 15 }} pnpm exec tsx scripts/catalog/resolve.ts --max-minutes ${{ inputs.smoke && 2 || 10 }}

      # 32 workers (resolve.ts): every company is a different site. More threads for its DNS lookups.
      - name: Resolve Wikidata companies
        id: bulk
        continue-on-error: true
        timeout-minutes: 59
        env:
          UV_THREADPOOL_SIZE: 32
        run: bash scripts/catalog/capped.sh "Wikidata companies" ${{ inputs.smoke && 8 || 57 }} bash -c "pnpm exec tsx scripts/catalog/seeds-bulk.ts && pnpm exec tsx scripts/catalog/resolve.ts --bulk --limit ${{ inputs.smoke && 20 || 2400 }} --max-minutes ${{ inputs.smoke && 2 || 45 }}"

      # Workday companies' own careers sites (Phenom, Radancy, Eightfold…), read from their websites:
      # Workday turns automated readers away. Biggest companies first; continues next week.
      - name: Own careers sites of Workday companies
        id: ownsites
        continue-on-error: true
        timeout-minutes: 22
        env:
          UV_THREADPOOL_SIZE: 16
        run: bash scripts/catalog/capped.sh "Own careers sites" ${{ inputs.smoke && 5 || 20 }} pnpm exec tsx scripts/catalog/own-sites.ts --max-minutes ${{ inputs.smoke && 2 || 15 }}

      # Only from a restored state, so a run that started from nothing never replaces good state.
      # Also after a step ran out of time: the scripts save what they have.
      - name: Hand the results to collect
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        working-directory: scripts/catalog
        run: |
          h="$RUNNER_TEMP/handoff"
          mkdir -p "$h/out" "$h/raw/wikidata"
          [ ! -f raw/wikidata/companies.json ] || cp raw/wikidata/companies.json "$h/raw/wikidata/companies.json"
          [ ! -f out/resolved.json ] || cp out/resolved.json "$h/out/resolved.json"
          [ ! -f out/resolved-bulk.json ] || cp out/resolved-bulk.json "$h/out/resolved-bulk.json"
          [ ! -f out/own-sites.jsonl ] || cp out/own-sites.jsonl "$h/out/own-sites.jsonl"
          [ ! -f out/own-sites.json ] || cp out/own-sites.json "$h/out/own-sites.json"

      - name: Upload the hand-off
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-resolve
          # The folder's contents (out/…, raw/…) are the artifact's root, so they land on the same
          # paths under scripts/catalog in collect.
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: ignore
          retention-days: 3
          # A re-run of this job replaces its earlier hand-off.
          overwrite: true

  check-known:
    needs: due
    if: needs.due.outputs.run == 'true'
    # Secrets come from the `data-repo` environment (main only). A test run on another branch gets
    # none and reads with github.token, so it can't publish.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'data-repo' || '' }}
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CONTRIBUTIONS_FILE: ${{ github.workspace }}/directory-repo/contributions.json
      DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check out the public directory repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN || github.token }}
          path: directory-repo

      - name: Restore the catalog's working state
        id: state
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN || github.token }}
        run: bash scripts/catalog/state.sh restore

      - name: Download the public lists
        timeout-minutes: 5
        run: |
          [ -f directory-repo/contributions.json ] || echo '{"companies":[]}' > directory-repo/contributions.json
          pnpm catalog:sources

      # Last week's resolving is in the restored state; this week's new boards are checked in collect.
      - name: Merge
        timeout-minutes: 5
        run: pnpm exec tsx scripts/catalog/merge.ts

      - name: Check boards
        id: check1
        continue-on-error: true
        timeout-minutes: 72
        run: bash scripts/catalog/capped.sh "Check boards" ${{ inputs.smoke && 5 || 70 }} pnpm exec tsx scripts/catalog/check.ts --recheck-days 30 --max-minutes ${{ inputs.smoke && 2 || 60 }}

      # Known companies tried on other systems (needs fresh check results).
      - name: Cross-probe
        id: crossprobe
        continue-on-error: true
        timeout-minutes: 27
        run: bash scripts/catalog/capped.sh "Cross-probe" ${{ inputs.smoke && 5 || 25 }} pnpm exec tsx scripts/catalog/crossprobe.ts --max-minutes ${{ inputs.smoke && 2 || 20 }}

      # Only from a restored state, so a run that started from nothing never replaces good state.
      # Also after a step ran out of time: the scripts save what they have.
      - name: Hand the results to collect
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        working-directory: scripts/catalog
        run: |
          h="$RUNNER_TEMP/handoff"
          mkdir -p "$h/out" "$h/raw/wikidata"
          # Under their own names: readChecks and compact.ts fold checks-*.jsonl and titles-*.jsonl into
          # checks.jsonl, so collect adds these to its copy instead of replacing it.
          [ ! -f out/checks.jsonl ] || cp out/checks.jsonl "$h/out/checks-known.jsonl"
          [ ! -f out/titles.jsonl ] || cp out/titles.jsonl "$h/out/titles-known.jsonl"
          [ ! -f out/probe.jsonl ] || cp out/probe.jsonl "$h/out/probe.jsonl"
          [ ! -f out/probe-found.json ] || cp out/probe-found.json "$h/out/probe-found.json"

      - name: Upload the hand-off
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-known
          # The folder's contents (out/…, raw/…) are the artifact's root, so they land on the same
          # paths under scripts/catalog in collect.
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: ignore
          retention-days: 3
          # A re-run of this job replaces its earlier hand-off.
          overwrite: true

  # Stage 2: takes both hand-offs, merges, checks the boards this week found, and saves the state.
  # Runs when a stage-1 job failed or ran out of time: that part keeps last week's copy.
  collect:
    needs: [due, resolve, check-known]
    if: ${{ !cancelled() && needs.due.outputs.run == 'true' }}
    # Secrets come from the `data-repo` environment (main only). A test run on another branch gets
    # none and reads with github.token, so it can't publish.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'data-repo' || '' }}
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CONTRIBUTIONS_FILE: ${{ github.workspace }}/directory-repo/contributions.json
      DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check out the public directory repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN || github.token }}
          path: directory-repo

      - name: Restore the catalog's working state
        id: state
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN || github.token }}
        run: bash scripts/catalog/state.sh restore

      - name: Download the public lists
        timeout-minutes: 5
        run: |
          [ -f directory-repo/contributions.json ] || echo '{"companies":[]}' > directory-repo/contributions.json
          pnpm catalog:sources

      # Smoke runs only: prove that a step past its timeout-minutes ends as a failure that
      # continue-on-error absorbs (the collectors rely on it as their last backstop).
      - name: Canary
        id: canary
        if: ${{ inputs.smoke }}
        continue-on-error: true
        timeout-minutes: 1
        run: sleep 120

      - name: Check the canary
        if: ${{ inputs.smoke }}
        run: |
          [ "${{ steps.canary.outcome }}" = failure ] || { echo "::error::A step past its timeout-minutes ended as '${{ steps.canary.outcome }}', not failure."; exit 1; }
          echo "OK: a step past its timeout-minutes fails, and continue-on-error keeps the job going."

      # Our own URL lists (Common Crawl, Wayback) are read by directory-commoncrawl.yml; their
      # results are in the restored state and picked up by the merge below.

      - name: Take the resolving
        id: got_resolve
        if: steps.state.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-resolve
          path: scripts/catalog

      - name: Take the checks and the cross-probe
        id: got_known
        if: steps.state.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-known
          path: scripts/catalog

      # A missing hand-off (that job failed) only warns: that part keeps last week's copy. One that
      # arrived without its files landing where expected is a broken workflow, so it fails.
      - name: Check the hand-offs
        if: steps.state.outcome == 'success'
        working-directory: scripts/catalog
        run: |
          if [ "${{ steps.got_resolve.outcome }}" = success ]; then
            [ -s out/resolved-bulk.json ] || [ -s out/resolved.json ] || { echo "::error::The resolving arrived but out/resolved*.json is missing."; exit 1; }
          else
            echo "::warning::No resolving from this run; last week's stands."
            echo "- No resolving from this run; last week's stands." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.got_known.outcome }}" = success ]; then
            [ -s out/checks-known.jsonl ] || { echo "::error::The checks arrived but out/checks-known.jsonl is missing."; exit 1; }
          else
            echo "::warning::No board checks or cross-probe from this run; last week's stand."
            echo "- No board checks or cross-probe from this run; last week's stand." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Merge
        timeout-minutes: 5
        run: pnpm exec tsx scripts/catalog/merge.ts

      # This week's new boards (resolved and cross-probed), new ones first (check.ts).
      - name: Check new boards
        id: check2
        continue-on-error: true
        timeout-minutes: 32
        run: bash scripts/catalog/capped.sh "Check new boards" ${{ inputs.smoke && 5 || 30 }} pnpm exec tsx scripts/catalog/check.ts --recheck-days 30 --max-minutes ${{ inputs.smoke && 2 || 25 }}

      - name: Save the working state
        # Also after a failure or timeout, so progress isn't lost; but never when the restore failed,
        # or a run that started from nothing would overwrite good state. Only on main: a test run on
        # another branch reads with github.token, which can't write to the data repo.
        if: always() && steps.state.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh save

  # Restores what collect saved, builds, indexes, packages and gates. It holds no write token and no
  # signing key: it reads the public data repo with github.token and hands the release and the working
  # state to the sign and publish jobs below.
  build:
    needs: [resolve, check-known, collect]
    # Also when collect failed or hit its time limit: its progress was saved, and the release gate
    # decides whether the result is good enough to ship. Cancelling the run stops it.
    if: ${{ !cancelled() && needs.collect.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      # The summary reads the run's own step times.
      actions: read
    outputs:
      artifact: ${{ steps.handoff.outputs.artifact-id }}
      gate: ${{ steps.gate.outcome }}
      outcomes: ${{ toJSON(steps) }}
    env:
      CONTRIBUTIONS_FILE: ${{ github.workspace }}/directory-repo/contributions.json
      DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
      # Approved moves: the directory's `moves` list (build.ts).
      MOVES_FILE: ${{ github.workspace }}/directory-repo/moves.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check out the public directory repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          path: directory-repo
          persist-credentials: false

      - name: Restore the working state collect saved
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/catalog/state.sh restore

      # merged.json isn't part of the saved state: merge again from the lists and saved results.
      - name: Download the public lists
        timeout-minutes: 5
        run: |
          [ -f directory-repo/contributions.json ] || echo '{"companies":[]}' > directory-repo/contributions.json
          pnpm catalog:sources

      # Government lists of employers that may sponsor work visas (UK, US, Canada, Netherlands): the
      # directory's `visa` field. A register that fails keeps last week's copy (in the saved state).
      - name: Download the visa sponsor registers
        continue-on-error: true
        timeout-minutes: 10
        run: pnpm catalog:visa

      - name: Merge
        timeout-minutes: 5
        run: pnpm exec tsx scripts/catalog/merge.ts

      - name: Build
        timeout-minutes: 5
        run: pnpm exec tsx scripts/catalog/build.ts

      # The job index takes most companies' rows from it, and publish reads job titles from it for
      # industry tags (best effort).
      - name: Download the job feed
        id: feed
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/catalog/feed.sh

      # Rows from the feed for the boards it read in the last 7 days; the rest are read live. Only with
      # the feed's second format: if the download failed or fell back to the first, everything is read live.
      - name: Index open jobs
        id: index
        continue-on-error: true
        timeout-minutes: 72
        env:
          FEED_ARGS: ${{ steps.feed.outcome == 'success' && steps.feed.outputs.format == 'v2' && '--feed scripts/catalog/out/feed' || '' }}
        run: bash scripts/catalog/capped.sh "Index open jobs" ${{ inputs.smoke && 5 || 70 }} pnpm exec tsx scripts/catalog/index.ts --max-age-days 7 --max-minutes ${{ inputs.smoke && 2 || 60 }} $FEED_ARGS

      - name: Package
        timeout-minutes: 10
        run: |
          pnpm exec tsx scripts/catalog/publish.ts --data dist-data
          pnpm exec tsx scripts/catalog/coverage.ts --data dist-data
          pnpm exec tsx scripts/catalog/release.ts --data dist-data --out dist

      # A refused release doesn't fail this job: the publish job still saves the state and reports it.
      - name: Release gate
        id: gate
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
        run: bash scripts/catalog/gate.sh

      - name: Pack the working state
        # Also after a failure or timeout, so progress isn't lost; but never when the restore failed,
        # or a run that started from nothing would overwrite good state. The publish job uploads it.
        if: always() && steps.state.outcome == 'success'
        run: bash scripts/catalog/state.sh pack

      - name: Gather the hand-over
        if: always() && steps.state.outcome == 'success'
        run: |
          mkdir -p handoff
          if [ -f "$RUNNER_TEMP/catalog-state.tar.gz" ]; then mv "$RUNNER_TEMP/catalog-state.tar.gz" handoff/; fi
          if [ -f dist/manifest.json ]; then cp -r dist handoff/dist; fi
          if [ -f scripts/catalog/out/coverage.md ]; then cp scripts/catalog/out/coverage.md handoff/; fi
          ls -la handoff handoff/dist 2> /dev/null || true

      - name: Hand the release and the state to the sign and publish jobs
        id: handoff
        if: always() && steps.state.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: directory-release
          path: handoff/
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          echo "$OUTCOMES" | jq -r 'to_entries[] | select(.key != "canary" and .value.outcome == "failure" and .value.conclusion == "success") | "::warning::\(.key) did not finish; the rebuild went on without it."'
          {
            echo "### Weekly rebuild${{ inputs.smoke && ' (smoke test)' || '' }}"
            echo
            echo "| Step | Result | Minutes |"
            echo "|---|---|---|"
            gh run view "${{ github.run_id }}" -R "${{ github.repository }}" --json jobs -q '.jobs[] | select(.name == "resolve" or .name == "check-known" or .name == "collect" or .name == "build") | .name as $job | .steps[] | select(.conclusion != null and .conclusion != "" and (.completedAt | startswith("0001") | not)) | "| \($job): \(.name) | \(.conclusion) | \((((.completedAt | fromdate) - (.startedAt | fromdate)) / 60) | floor) |"' || echo "| (step times unavailable) | | |"
            echo
            live="${RUNNER_TEMP}/live-manifest.json"
            if [ -s "$live" ]; then echo "Live release: $(jq -r '"\(.companies) companies, \(.indexed) indexed"' "$live")."; fi
            if [ -f dist/manifest.json ]; then echo "This run's directory: $(jq -r '"\(.companies) companies, \(.indexed) indexed"' dist/manifest.json)."; fi
            echo
            # What the saved state holds and what this run added (collect's results, restored above).
            since=$(gh run view "${{ github.run_id }}" -R "${{ github.repository }}" --json createdAt -q .createdAt) &&
              pnpm exec tsx scripts/catalog/tally.ts --since "$since" || echo "(working state unavailable)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Signs the manifest and does nothing else: the `data-signing` environment (main only) holds the data
  # key alone. A sparse checkout, plain Node and no install, so nothing from node_modules or the crawl
  # runs while the key is loaded. A manifest older than the live one, or odd, isn't signed.
  sign:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.gate == 'success' && !inputs.smoke && github.ref == 'refs/heads/main' }}
    environment: data-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.signature.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/catalog/sign.mjs
            scripts/catalog/check-manifest.mjs
            scripts/catalog/live-copy.sh
            packages/core/src/data-signing.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: handoff

      - name: Refuse an older or odd manifest
        run: |
          bash scripts/catalog/live-copy.sh latest manifest.json "$RUNNER_TEMP/live-manifest.json"
          node scripts/catalog/check-manifest.mjs --dir handoff/dist handoff/dist/manifest.json --live "$RUNNER_TEMP/live-manifest.json"

      - name: Sign the manifest
        timeout-minutes: 2
        env:
          RAWJOBS_DATA_SIGNING_KEY: ${{ secrets.RAWJOBS_DATA_SIGNING_KEY }}
        # Apps accept the data only with a valid signature (packages/core/src/data-signing.ts).
        run: |
          export RAWJOBS_DATA_PUBLIC_KEY="$(grep -o 'DATA_PUBLIC_KEY = "[^"]*"' packages/core/src/data-signing.ts | cut -d'"' -f2)"
          node scripts/catalog/sign.mjs handoff/dist/manifest.json

      - id: signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: directory-signature
          path: handoff/dist/manifest.json.sig
          retention-days: 1
          if-no-files-found: error

  # Publishes, saves the state and commits the coverage report with the data repo's token (`data-repo`
  # environment, main only) and no install: only gh, jq, git and the repo's shell scripts run here.
  # When the sign job didn't sign (a refused release), only the upload is skipped.
  publish:
    needs: [resolve, check-known, collect, build, sign]
    if: ${{ always() && needs.build.result != 'skipped' && !inputs.smoke && github.ref == 'refs/heads/main' }}
    environment:
      name: data-repo
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      # Start the site deploy after publishing.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the release and the state
        id: handoff
        if: needs.build.outputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: handoff
      - name: Take the signature
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact }}
          path: handoff/dist

      - name: Publish the release
        id: publish
        if: needs.sign.result == 'success'
        timeout-minutes: 5
        working-directory: handoff
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          day=$(date -u +%Y-%m-%d)
          tag="directory-$day"
          # A second run on the same day gets its own release instead of failing on the tag.
          if gh release view "$tag" -R "$DATA_REPO" > /dev/null 2>&1; then tag="$tag-$(date -u +%H%M)"; fi
          version=$(jq -r .version dist/manifest.json)
          companies=$(jq -r .companies dist/manifest.json)
          # gh creates the release as a draft, uploads every file, then publishes it, so no install
          # ever sees a latest release with files missing.
          gh release create "$tag" dist/* -R "$DATA_REPO" --latest --title "Directory $day" \
            --notes "Version $version · $companies companies. Download manifest.json first; files are checked against its SHA-256."

      - name: Save the working state
        if: always() && steps.handoff.outcome == 'success' && hashFiles('handoff/catalog-state.tar.gz') != ''
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh upload catalog handoff/catalog-state.tar.gz

      - name: Refresh the site's numbers
        # The site reads the latest release at build time; its own Monday schedule is only a backup.
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml -R "${{ github.repository }}" --ref main

      - name: Check out the public directory repo
        if: steps.publish.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: directory-repo

      - name: Commit the coverage report
        if: steps.publish.outcome == 'success'
        working-directory: directory-repo
        run: |
          cp ../handoff/coverage.md coverage.md
          cp ../handoff/dist/manifest.json manifest.json
          git config user.name "rawjobs-bot"
          git config user.email "rawjobs-bot@users.noreply.github.com"
          git add coverage.md manifest.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Weekly directory $(date -u +%Y-%m-%d)"
          # The contributions and move approval workflows push here too, each in its own concurrency group.
          . "$GITHUB_WORKSPACE/scripts/catalog/release-io.sh"
          push_with_retry

      - name: Report a run that didn't publish
        # Keyed on the publish step, not on failure()/cancelled(): a timeout, a failed step and a
        # refused release all land here.
        if: always() && steps.publish.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOMES: ${{ needs.build.outputs.outcomes || '{}' }}
          RESOLVE: ${{ needs.resolve.result }}
          CHECK_KNOWN: ${{ needs.check-known.result }}
          COLLECT: ${{ needs.collect.result }}
          BUILD: ${{ needs.build.result }}
          SIGN: ${{ needs.sign.result }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          title="Directory rebuild did not publish"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          steps=$(printf -- '- resolve job: %s\n- check-known job: %s\n- collect job: %s\n- build job: %s\n%s\n- sign job: %s\n- publish: %s' "$RESOLVE" "$CHECK_KNOWN" "$COLLECT" "$BUILD" "$(echo "$OUTCOMES" | jq -r 'to_entries | map("  - \(.key): \(.value.outcome)") | join("\n")')" "$SIGN" "${PUBLISH:-skipped}")
          body=$(printf 'The weekly rebuild ended without a new release. Installs keep the current one.\n\nRun: %s\n\nSteps:\n%s\n\nIf the release gate refused a deliberate shrink, re-run with: gh workflow run directory-rebuild.yml -f allow_shrink=true' "$run_url" "$steps")
          open=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" -R "${{ github.repository }}" --body "$body"; else gh issue create -R "${{ github.repository }}" --title "$title" --body "$body"; fi
          # The run shows as failed, as it did when the gate stopped the single publish job.
          exit 1
