# Every 3 hours: take companies users shared from the inbox, live-check them, add the good ones to
# the public directory repo's contributions.json, and publish an updated directory right away.
# With nothing in the inbox, spend up to 30 minutes on the board-check backlog instead, so it
# drains between weekly rebuilds (the results ship with the next release).
# Each run also reads the public job boards for links to companies' own boards (feed-boards.ts).
# Then review moved careers pages users reported (scripts/catalog/moves.ts): gates, company-page
# evidence, review issues, auto-accept when MOVES_AUTO_ACCEPT is set (docs/plans/auto-accept-moves.md).
# Setup: docs/shared-directory.md
name: Directory · contributions

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

# queue: max — runs wait their turn (up to 100) instead of the default, where a newer waiting run
# cancels the older one (which could be a queued weekly rebuild).
concurrency:
  group: directory
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  issues: write
  # To start an overdue weekly rebuild and keep the schedules on (scripts/catalog/watchdog.sh).
  actions: write

env:
  DATA_REPO: ${{ vars.DATA_REPO || 'Tanmay-Mhatre/rawjobs-directory' }}

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check the inbox
        id: inbox
        env:
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        # 500 a page; up to 4 pages a run (about the inbox's daily cap), the rest next run.
        run: |
          echo '[]' > "$RUNNER_TEMP/items.json"
          cursor=""
          for page in 1 2 3 4; do
            curl -fsS -G -H "Authorization: Bearer $INBOX_TOKEN" ${cursor:+--data-urlencode "cursor=$cursor"} "$INBOX_URL/v1/pending" -o "$RUNNER_TEMP/page.json"
            jq -s '.[0] + .[1].items' "$RUNNER_TEMP/items.json" "$RUNNER_TEMP/page.json" > "$RUNNER_TEMP/merged.json"
            mv "$RUNNER_TEMP/merged.json" "$RUNNER_TEMP/items.json"
            cursor=$(jq -r '.cursor // ""' "$RUNNER_TEMP/page.json")
            # No cursor (an inbox from before paging) or nothing more: done.
            [ "$(jq -r '.more' "$RUNNER_TEMP/page.json")" = true ] && [ -n "$cursor" ] || break
          done
          jq '{items: unique_by(.id)}' "$RUNNER_TEMP/items.json" > "$RUNNER_TEMP/inbox.json"
          echo "count=$(jq '.items | length' "$RUNNER_TEMP/inbox.json")" >> "$GITHUB_OUTPUT"

      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check out the public directory repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: directory-repo

      - name: Restore the catalog's working state
        id: state
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        # Without saved state, contributions are recorded now and published at the weekly rebuild.
        run: bash scripts/catalog/state.sh restore

      # Boards the public job boards' jobs link to (apply links, links in posts): only the board is
      # kept, never the jobs. Each feed is read at most as often as it allows; the merge below picks
      # them up and new ones are checked live before they're published. Never stops the run.
      - if: steps.state.outputs.restored == 'true'
        name: Boards from job feeds
        continue-on-error: true
        timeout-minutes: 10
        run: bash scripts/catalog/capped.sh "Boards from job feeds" 8 pnpm exec tsx scripts/catalog/feed-boards.ts --max-minutes 5

      - if: steps.inbox.outputs.count != '0'
        name: Accept contributions
        id: accept
        env:
          DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
        run: |
          [ -f directory-repo/contributions.json ] || echo '{"companies":[]}' > directory-repo/contributions.json
          pnpm exec tsx scripts/catalog/contributions.ts --inbox "$RUNNER_TEMP/inbox.json" --into directory-repo/contributions.json > "$RUNNER_TEMP/summary.json"
          cat "$RUNNER_TEMP/summary.json"
          echo "accepted=$(jq .accepted "$RUNNER_TEMP/summary.json")" >> "$GITHUB_OUTPUT"

      - if: steps.accept.outputs.accepted != '0' && steps.accept.outputs.accepted != '' && steps.state.outputs.restored == 'true'
        name: Build an updated directory
        env:
          CONTRIBUTIONS_FILE: ${{ github.workspace }}/directory-repo/contributions.json
          DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
          # Approved moves: the directory's `moves` list (build.ts).
          MOVES_FILE: ${{ github.workspace }}/directory-repo/moves.json
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          pnpm catalog:sources
          pnpm exec tsx scripts/catalog/merge.ts
          # Time-boxed: shared boards are checked first; any backlog (new sources, new hiring systems)
          # is worked through a little each run, and fully by the weekly rebuild.
          pnpm exec tsx scripts/catalog/check.ts --max-minutes 30
          pnpm exec tsx scripts/catalog/build.ts
          pnpm exec tsx scripts/catalog/index.ts --max-age-days 9999
          # Job titles for industry tags, as the weekly rebuild reads them (best effort).
          bash scripts/catalog/feed.sh
          pnpm exec tsx scripts/catalog/publish.ts --data dist-data
          pnpm exec tsx scripts/catalog/release.ts --data dist-data --out dist

      - if: steps.state.outputs.restored == 'true' && (steps.accept.outputs.accepted == '0' || steps.accept.outputs.accepted == '')
        name: Check boards (backlog)
        id: backlog
        continue-on-error: true
        timeout-minutes: 40
        env:
          CONTRIBUTIONS_FILE: ${{ github.workspace }}/directory-repo/contributions.json
          DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
        run: |
          [ -f directory-repo/contributions.json ] || echo '{"companies":[]}' > directory-repo/contributions.json
          pnpm catalog:sources
          pnpm exec tsx scripts/catalog/merge.ts
          bash scripts/catalog/capped.sh "Check boards" 35 pnpm exec tsx scripts/catalog/check.ts --max-minutes 30

      # A refused release must not stop the rest: contributions are still committed, acknowledged
      # and saved, and go out with the next release that passes. No allow_shrink here: an owner
      # who means a shrink re-runs the weekly rebuild with it, which sets a new baseline.
      - if: steps.accept.outputs.accepted != '0' && steps.accept.outputs.accepted != '' && steps.state.outputs.restored == 'true'
        name: Release gate
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/gate.sh

      - name: Sign the manifest
        if: steps.gate.outcome == 'success'
        timeout-minutes: 2
        env:
          RAWJOBS_DATA_SIGNING_KEY: ${{ secrets.RAWJOBS_DATA_SIGNING_KEY }}
        # Apps accept the data only with a valid signature (packages/core/src/data-signing.ts).
        run: |
          export RAWJOBS_DATA_PUBLIC_KEY="$(grep -o 'DATA_PUBLIC_KEY = "[^"]*"' packages/core/src/data-signing.ts | cut -d'"' -f2)"
          node scripts/catalog/sign.mjs dist/manifest.json

      - if: steps.gate.outcome == 'success'
        name: Publish the updated directory
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        # A new dated release each time (never overwriting the last one), so any earlier directory
        # can be made the latest again: gh release edit <tag> -R "$DATA_REPO" --latest
        run: |
          base=$(gh release view -R "$DATA_REPO" --json tagName -q .tagName)
          tag="directory-$(date -u +%Y-%m-%d-%H%M)-shared"
          version=$(jq -r .version dist/manifest.json)
          companies=$(jq -r .companies dist/manifest.json)
          # gh creates it as a draft, uploads every file, then publishes it as the latest.
          gh release create "$tag" dist/* -R "$DATA_REPO" --latest --title "Directory $(date -u +%Y-%m-%d) + shared companies" \
            --notes "$base plus ${{ steps.accept.outputs.accepted }} companies users shared. Version $version · $companies companies. Download manifest.json first; files are checked against its SHA-256."

      - if: always() && steps.state.outputs.restored == 'true'
        name: Save the working state
        # Also after a failure or timeout, so the checks done so far aren't lost. The same files every
        # run saves, so this never wipes the weekly rebuild's progress.
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh save

      - if: steps.accept.outputs.accepted != '0' && steps.accept.outputs.accepted != ''
        name: Commit contributions.json
        working-directory: directory-repo
        run: |
          git config user.name "rawjobs-bot"
          git config user.email "rawjobs-bot@users.noreply.github.com"
          git add contributions.json
          git commit -m "Add ${{ steps.accept.outputs.accepted }} companies shared by users"
          git push

      - if: steps.inbox.outputs.count != '0'
        name: Acknowledge processed contributions
        env:
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        # The inbox removes at most 1,000 a request.
        run: |
          jq -c '.processed | _nwise(1000) | {ids: .}' "$RUNNER_TEMP/summary.json" | while read -r batch; do
            curl -fsS -X POST -H "Authorization: Bearer $INBOX_TOKEN" -H "content-type: application/json" --data "$batch" "$INBOX_URL/v1/ack"
          done

      # ---- Moved careers pages (record-only: checked and recorded; a maintainer approves on the
      # issue, .github/workflows/directory-move-approval.yml). None of these steps can stop the rest.
      - name: Check the move inbox
        id: moves_inbox
        continue-on-error: true
        timeout-minutes: 5
        env:
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        # An inbox without /v1/moves (404) has no move reports yet: skip quietly. 500 a page, 4 pages a run.
        run: |
          echo '[]' > "$RUNNER_TEMP/move-items.json"
          cursor=""
          pages=0
          for page in 1 2 3 4; do
            code=$(curl -sS -G -o "$RUNNER_TEMP/move-page.json" -w '%{http_code}' -H "Authorization: Bearer $INBOX_TOKEN" ${cursor:+--data-urlencode "cursor=$cursor"} "$INBOX_URL/v1/moves/pending")
            if [ "$code" = 404 ] && [ "$page" = 1 ]; then
              echo "The inbox has no move reports endpoint yet: skipping moves."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$code" = 200 ] || { echo "::error::GET /v1/moves/pending answered $code"; exit 1; }
            pages=$page
            jq -s '.[0] + (.[1].items // [])' "$RUNNER_TEMP/move-items.json" "$RUNNER_TEMP/move-page.json" > "$RUNNER_TEMP/move-merged.json"
            mv "$RUNNER_TEMP/move-merged.json" "$RUNNER_TEMP/move-items.json"
            cursor=$(jq -r '.cursor // ""' "$RUNNER_TEMP/move-page.json")
            [ -n "$cursor" ] || break
          done
          jq '{items: unique_by(.id)}' "$RUNNER_TEMP/move-items.json" > "$RUNNER_TEMP/move-inbox.json"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.items | length' "$RUNNER_TEMP/move-inbox.json")" >> "$GITHUB_OUTPUT"
          # Four full pages and still a cursor: more reports than a run takes.
          if [ "$pages" = 4 ] && [ -n "$cursor" ]; then echo "full=true" >> "$GITHUB_OUTPUT"; else echo "full=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.moves_inbox.outputs.available == 'true'
        name: Review move reports
        id: moves
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          ISSUES_TOKEN: ${{ github.token }}
          DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
          # Off (unset): shadow mode, the verdict is only shown on review issues. "true": moves with
          # company-owned evidence are accepted without a person (scripts/catalog/lib/moves.ts autoAcceptEnabled).
          AUTO_ACCEPT: ${{ vars.MOVES_AUTO_ACCEPT || '' }}
        # The gates need the current directory: the live release's (merged.json isn't kept between runs).
        run: |
          gh release download -R "$DATA_REPO" -p directory.json.gz -O "$RUNNER_TEMP/live-directory.json.gz" --clobber
          gunzip -c "$RUNNER_TEMP/live-directory.json.gz" > "$RUNNER_TEMP/live-directory.json"
          GH_TOKEN="$ISSUES_TOKEN" pnpm exec tsx scripts/catalog/moves.ts --items "$RUNNER_TEMP/move-inbox.json" --dir directory-repo \
            --directory "$RUNNER_TEMP/live-directory.json" --issues --max-minutes 10 > "$RUNNER_TEMP/moves-summary.json"
          jq -c 'del(.processed)' "$RUNNER_TEMP/moves-summary.json"
          echo "done=true" >> "$GITHUB_OUTPUT"

      - if: steps.moves.outputs.done == 'true'
        name: Commit moves-pending.json
        id: moves_commit
        continue-on-error: true
        working-directory: directory-repo
        # The approval workflow may have pushed moves.json since the checkout: rebase onto it, and check
        # there's still one active move per old board before pushing (both may have accepted one).
        run: |
          git config user.name "rawjobs-bot"
          git config user.email "rawjobs-bot@users.noreply.github.com"
          for f in moves-pending.json moves.json moves-blocked.json moves-baselines.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Move reports: $(jq -r '"\(.inbox) new, \(.passed) passing, \(.held) held, \(.rejected) rejected, \(.accepted) accepted"' "$RUNNER_TEMP/moves-summary.json")"
          for try in 1 2 3; do
            if git pull --rebase --quiet; then
              (cd .. && pnpm exec tsx scripts/catalog/moves-lint.ts directory-repo/moves.json) || exit 1
              git push && exit 0
            fi
            sleep $((try * 5))
          done
          exit 1

      - if: steps.moves_commit.outcome == 'success'
        name: Acknowledge move reports
        continue-on-error: true
        env:
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        # Only once they're safely in moves-pending.json.
        run: |
          jq -c '.processed | _nwise(1000) | {ids: .}' "$RUNNER_TEMP/moves-summary.json" | while read -r batch; do
            curl -fsS -X POST -H "Authorization: Bearer $INBOX_TOKEN" -H "content-type: application/json" --data "$batch" "$INBOX_URL/v1/moves/ack"
          done

      - if: always() && steps.moves_inbox.outputs.available == 'true'
        name: Move reports summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INBOX_FULL: ${{ steps.moves_inbox.outputs.full }}
          REVIEW_OUTCOME: ${{ steps.moves.outcome }}
        # One alert issue, de-duplicated: many held or rejected reports at once, or more than a run can take.
        run: |
          s="$RUNNER_TEMP/moves-summary.json"
          if [ ! -s "$s" ]; then
            echo "### Move reports: the review step didn't finish ($REVIEW_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Move reports (auto-accept $(jq -r 'if .auto_accept then "on" else "off: shadow mode" end' "$s"))"
            echo
            echo "| New reports | Passing (review issue) | Held | Rejected | Removals | Expired | Accepted | Issues opened |"
            echo "|---|---|---|---|---|---|---|---|"
            jq -r '"| \(.inbox) | \(.passed) | \(.held) | \(.rejected) | \(.removals) | \(.expired) | \(.accepted) | \(.issues_opened) |"' "$s"
            echo
            echo "| Would auto-accept | Fast-track | Page unreadable | Unreported board | Auto confirmed | Auto reverted | Re-check unknown | Blocked | Baselines |"
            echo "|---|---|---|---|---|---|---|---|---|"
            jq -r '"| \(.would_auto) | \(.fast_track) | \(.evidence_unknown) | \(.unreported) | \(.confirmed) | \(.reverted) | \(.reverify_unknown) | \(.blocked_added) | \(.baselines_taken) |"' "$s"
            jq -r 'if .cap_hit then "\nThe check cap (50 a run) was hit: the rest wait for the next run." else empty end' "$s"
          } >> "$GITHUB_STEP_SUMMARY"
          spike=$(jq '(.held + .rejected) > 100 or (.rejected > 50) or (.reverted > 0)' "$s")
          if [ "$spike" != true ] && [ "$INBOX_FULL" != true ] && [ "$(jq .cap_hit "$s")" != true ]; then exit 0; fi
          title="Move reports need a look"
          body=$(printf 'Unusual move reports in this run: %s\n\nA spike of held or rejected reports can mean someone is flooding the inbox; a full inbox or a hit check cap means reports wait longer; a reverted auto move means a company page now points somewhere else (it is blocked for good). Auto-accept is %s.\n\nRun: %s' "$(jq -c 'del(.processed, .rejections)' "$s")" "$(jq -r 'if .auto_accept then "on" else "off" end' "$s")" "$RUN_URL")
          open=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" -R "$REPO" --body "$body"; else gh issue create -R "$REPO" --title "$title" --body "$body"; fi

      - if: always() && steps.gate.outcome == 'failure'
        name: Report a refused release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Directory release refused"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The release gate refused the updated directory (see the run summary for why). Installs keep the current release; the shared companies are saved and go out with the next release that passes.\n\nRun: %s\n\nIf the shrink is deliberate (a purge), publish it with: gh workflow run directory-rebuild.yml -f allow_shrink=true' "$run_url")
          open=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" -R "${{ github.repository }}" --body "$body"; else gh issue create -R "${{ github.repository }}" --title "$title" --body "$body"; fi
          exit 1

      # Even when the inbox is down: these only need the checkout.
      - name: Start the weekly rebuild if it's overdue
        if: always() && steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/catalog/watchdog.sh rebuild

      - name: Keep the schedules alive
        if: always() && steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/catalog/watchdog.sh keepalive
