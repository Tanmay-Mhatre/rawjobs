# Every 3 hours: take companies users shared from the inbox, live-check them, add the good ones to
# the public directory repo's contributions.json, and publish an updated directory right away.
# Setup: docs/shared-directory.md
name: Directory · contributions

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: directory
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  DATA_REPO: ${{ vars.DATA_REPO || 'Tanmay-Mhatre/rawjobs-directory' }}

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check the inbox
        id: inbox
        env:
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: |
          curl -fsS -H "Authorization: Bearer $INBOX_TOKEN" "$INBOX_URL/v1/pending" -o "$RUNNER_TEMP/inbox.json"
          echo "count=$(jq '.items | length' "$RUNNER_TEMP/inbox.json")" >> "$GITHUB_OUTPUT"

      - if: steps.inbox.outputs.count != '0'
        uses: actions/checkout@v4

      - if: steps.inbox.outputs.count != '0'
        uses: pnpm/action-setup@v4

      - if: steps.inbox.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - if: steps.inbox.outputs.count != '0'
        run: pnpm install --frozen-lockfile

      - if: steps.inbox.outputs.count != '0'
        name: Check out the public directory repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: directory-repo

      - if: steps.inbox.outputs.count != '0'
        name: Restore the catalog's working state
        id: state
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        # Without saved state, contributions are recorded now and published at the weekly rebuild.
        run: bash scripts/catalog/state.sh restore

      - if: steps.inbox.outputs.count != '0'
        name: Accept contributions
        id: accept
        env:
          DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
        run: |
          [ -f directory-repo/contributions.json ] || echo '{"companies":[]}' > directory-repo/contributions.json
          pnpm exec tsx scripts/catalog/contributions.ts --inbox "$RUNNER_TEMP/inbox.json" --into directory-repo/contributions.json > "$RUNNER_TEMP/summary.json"
          cat "$RUNNER_TEMP/summary.json"
          echo "accepted=$(jq .accepted "$RUNNER_TEMP/summary.json")" >> "$GITHUB_OUTPUT"

      - if: steps.accept.outputs.accepted != '0' && steps.accept.outputs.accepted != '' && steps.state.outputs.restored == 'true'
        name: Build an updated directory
        env:
          CONTRIBUTIONS_FILE: ${{ github.workspace }}/directory-repo/contributions.json
          DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
        run: |
          pnpm catalog:sources
          pnpm exec tsx scripts/catalog/merge.ts
          # Time-boxed: shared boards are checked first; any backlog (new sources, new hiring systems)
          # is worked through a little each run, and fully by the weekly rebuild.
          pnpm exec tsx scripts/catalog/check.ts --max-minutes 30
          pnpm exec tsx scripts/catalog/build.ts
          pnpm exec tsx scripts/catalog/index.ts --max-age-days 9999
          pnpm exec tsx scripts/catalog/publish.ts --data dist-data
          pnpm exec tsx scripts/catalog/release.ts --data dist-data --out dist

      # A refused release must not stop the rest: contributions are still committed, acknowledged
      # and saved, and go out with the next release that passes. No allow_shrink here: an owner
      # who means a shrink re-runs the weekly rebuild with it, which sets a new baseline.
      - if: steps.accept.outputs.accepted != '0' && steps.accept.outputs.accepted != '' && steps.state.outputs.restored == 'true'
        name: Release gate
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/gate.sh

      - if: steps.gate.outcome == 'success'
        name: Publish the updated directory
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          tag=$(gh release view -R "$DATA_REPO" --json tagName -q .tagName)
          # Data files first, manifest last: an install that reads in between finds files that don't
          # match its manifest's SHA-256 and keeps the copy it has.
          gh release upload "$tag" dist/*.gz -R "$DATA_REPO" --clobber
          gh release upload "$tag" dist/manifest.json -R "$DATA_REPO" --clobber

      - if: always() && steps.accept.outputs.accepted != '0' && steps.accept.outputs.accepted != '' && steps.state.outputs.restored == 'true'
        name: Save the working state
        # Also after a failure or timeout, so the checks done so far aren't lost. The same files every
        # run saves, so this never wipes the weekly rebuild's progress.
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh save

      - if: steps.accept.outputs.accepted != '0' && steps.accept.outputs.accepted != ''
        name: Commit contributions.json
        working-directory: directory-repo
        run: |
          git config user.name "rawjobs-bot"
          git config user.email "rawjobs-bot@users.noreply.github.com"
          git add contributions.json
          git commit -m "Add ${{ steps.accept.outputs.accepted }} companies shared by users"
          git push

      - if: steps.inbox.outputs.count != '0'
        name: Acknowledge processed contributions
        env:
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: |
          jq '{ids: .processed}' "$RUNNER_TEMP/summary.json" > "$RUNNER_TEMP/ack.json"
          curl -fsS -X POST -H "Authorization: Bearer $INBOX_TOKEN" -H "content-type: application/json" --data @"$RUNNER_TEMP/ack.json" "$INBOX_URL/v1/ack"

      - if: always() && steps.gate.outcome == 'failure'
        name: Report a refused release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Directory release refused"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The release gate refused the updated directory (see the run summary for why). Installs keep the current release; the shared companies are saved and go out with the next release that passes.\n\nRun: %s\n\nIf the shrink is deliberate (a purge), publish it with: gh workflow run directory-rebuild.yml -f allow_shrink=true' "$run_url")
          open=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" -R "${{ github.repository }}" --body "$body"; else gh issue create -R "${{ github.repository }}" --title "$title" --body "$body"; fi
          exit 1
