name: Release

# Push a tag like v0.3.0 (the version in package.json) to publish a release: build the bundle, sign
# latest.json with the release key, install it on Windows, macOS and Linux, then publish.
# The tag's message becomes the "what's new" note shown in the dashboard.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches package.json
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $v"; exit 1; }
      - run: pnpm check
      - run: pnpm bundle
      # Unsigned here: this job ran `pnpm install`, so the key never comes near it (see sign).
      - name: Release files
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          pnpm release:files --unsigned --notes-file "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned
          path: dist/release
          if-no-files-found: error

  # The only job that sees the release key: no dependencies installed, just Node and sign.mjs
  # (node: imports only), so a compromised package can't read the key.
  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/catalog/sign.mjs
            packages/core/src/release.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-unsigned
          path: release
      - name: Sign latest.json
        env:
          RAWJOBS_SIGNING_KEY: ${{ secrets.RAWJOBS_SIGNING_KEY }}
        run: |
          public="$(grep -o 'RELEASE_PUBLIC_KEY = "[^"]*"' packages/core/src/release.ts | cut -d'"' -f2)"
          node scripts/catalog/sign.mjs --key-env RAWJOBS_SIGNING_KEY --public-key "$public" release/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error

  test:
    needs: sign
    uses: ./.github/workflows/install-test.yml
    with:
      artifact: release

  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          # The tag's message (also in latest.json, for the dashboard), then GitHub's list of changes.
          jq -r .notes release/latest.json > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "RawJobs ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes $pre
