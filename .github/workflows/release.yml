name: Release

# Push a tag like v0.3.0 (the version in package.json) to publish a release: build the bundle, sign
# latest.json with the release key, install it on Windows, macOS and Linux, then publish.
# The tag's message becomes the "what's new" note shown in the dashboard.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches package.json
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $v"; exit 1; }
      - run: pnpm check
      - run: pnpm bundle
      - name: Release files, signed
        env:
          RAWJOBS_SIGNING_KEY: ${{ secrets.RAWJOBS_SIGNING_KEY }}
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          pnpm release:files --notes-file "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/release
          if-no-files-found: error

  test:
    needs: build
    uses: ./.github/workflows/install-test.yml
    with:
      artifact: release

  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "RawJobs ${GITHUB_REF_NAME#v}" --generate-notes $pre
