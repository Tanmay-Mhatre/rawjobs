name: Release

# Push a tag like v0.5.1 to publish a release: build the bundle (as that version), sign latest.json
# with the release key, install it on Windows, macOS and Linux, then publish. The weekly release
# (weekly-release.yml) tags and calls this too.
# The tag's message becomes the "what's new" note shown in the dashboard. A line "Update: mandatory"
# in it makes it a required update; "Min-version: 0.5.0" makes older versions reinstall instead.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to release (already pushed), e.g. v0.5.1
        type: string
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.TAG }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag is a version
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::$TAG isn't a version tag like v0.5.1"; exit 1; }
      - run: pnpm check
      # The tag names the version: no version bump needed in package.json for each release.
      - run: pnpm bundle --version "${TAG#v}"
      # Unsigned here: this job ran `pnpm install`, so the key never comes near it (see sign).
      - name: Release files
        run: |
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
          pnpm release:files --unsigned --version "${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned
          path: dist/release
          if-no-files-found: error

  # The only job that sees the release key: no dependencies installed, just Node and sign.mjs
  # (node: imports only), so a compromised package can't read the key.
  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/catalog/sign.mjs
            packages/core/src/release.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-unsigned
          path: release
      - name: Sign latest.json
        env:
          RAWJOBS_SIGNING_KEY: ${{ secrets.RAWJOBS_SIGNING_KEY }}
        run: |
          public="$(grep -o 'RELEASE_PUBLIC_KEY = "[^"]*"' packages/core/src/release.ts | cut -d'"' -f2)"
          node scripts/catalog/sign.mjs --key-env RAWJOBS_SIGNING_KEY --public-key "$public" release/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error

  test:
    needs: sign
    uses: ./.github/workflows/install-test.yml
    with:
      artifact: release

  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # The tag's message (also in latest.json, for the dashboard), then GitHub's list of changes.
          jq -r .notes release/latest.json > "$RUNNER_TEMP/notes.md"
          if [ "$(jq -r .critical release/latest.json)" = true ]; then printf '\n\n**Required update.**\n' >> "$RUNNER_TEMP/notes.md"; fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "RawJobs ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes $pre
