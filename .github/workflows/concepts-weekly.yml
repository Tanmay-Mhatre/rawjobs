# Weekly: more words that prove each topic ("PSP" proves payments), found and checked automatically.
# scripts/catalog/concepts.ts looks each topic up in ESCO (the EU's skills list), keeps only words that pass its
# gates and that real job titles in the job feed back up, then scores the eval set with them. A list
# that makes the eval worse is never published, so apps keep last week's. Nothing here needs a person
# to approve it. Apps read concepts.json only with a valid signature (packages/core/src/concepts-remote.ts).
name: Concepts · weekly word list
# Runs the scheduler Worker starts are named so; empty means GitHub's usual name.
run-name: ${{ inputs.source == 'scheduler' && format('{0} · scheduler', github.workflow) || '' }}

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this run (the scheduler Worker sends scheduler)"
        type: string
        default: manual

permissions:
  contents: read
  issues: write

env:
  DATA_REPO: ${{ vars.DATA_REPO || 'Tanmay-Mhatre/rawjobs-directory' }}

concurrency:
  group: concepts
  cancel-in-progress: false

jobs:
  # GitHub's cron starts runs late, and a slot can get two triggers (it and the scheduler Worker):
  # a scheduled run whose slot another run already covers does nothing. Other runs always go ahead.
  covered:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/catalog/slot-covered.mjs
            .github/workflows/concepts-weekly.yml
          sparse-checkout-cone-mode: false
      - id: check
        name: Is this slot already covered?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          out=$(node scripts/catalog/slot-covered.mjs .github/workflows/concepts-weekly.yml runs)
          echo "$out"
          if grep -q '^covered=true' <<< "$out"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: another run already covers this schedule slot."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: covered
    if: needs.covered.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build and check the word list
        # Exit 2: the new words made the eval worse, so there's nothing to publish this week.
        id: build
        run: |
          set +e
          pnpm exec tsx scripts/catalog/concepts.ts --out scripts/catalog/out/concepts
          code=$?
          if [ "$code" = 2 ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Sign it
        if: steps.build.outputs.publish == 'true'
        timeout-minutes: 2
        env:
          RAWJOBS_DATA_SIGNING_KEY: ${{ secrets.RAWJOBS_DATA_SIGNING_KEY }}
        run: |
          export RAWJOBS_DATA_PUBLIC_KEY="$(grep -o 'DATA_PUBLIC_KEY = "[^"]*"' packages/core/src/data-signing.ts | cut -d'"' -f2)"
          node scripts/catalog/sign.mjs scripts/catalog/out/concepts/concepts.json

      - name: Publish
        if: steps.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        working-directory: scripts/catalog/out/concepts
        run: |
          # Not --latest: the directory download uses releases/latest.
          gh release view concepts -R "$DATA_REPO" > /dev/null 2>&1 ||
            gh release create concepts -R "$DATA_REPO" --latest=false --title "Topic word list" \
              --notes "Words that prove each topic, rebuilt weekly from ESCO (European Commission, reused under Decision 2011/833/EU) Read concepts.json with its signature."
          gh release upload concepts concepts.json concepts.json.sig -R "$DATA_REPO" --clobber

      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create concepts-failed --color B60205 --description "The weekly word list failed" --force > /dev/null
          gh issue list --label concepts-failed --state open --json number -q '.[0].number' | grep -q . ||
            gh issue create --label concepts-failed --title "Weekly word list failed" \
              --body "The weekly concepts workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Apps keep last week's list until it runs again."
