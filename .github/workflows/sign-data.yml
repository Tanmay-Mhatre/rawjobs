# By hand: sign what's already published, without rebuilding anything (about a minute). For the
# first signed copies, a release whose signing failed, or after changing the data signing key.
# Apps accept the directory and the job feed only with a valid signature
# (packages/core/src/data-signing.ts); the directory rebuild, contributions and job-feed workflows
# sign what they publish themselves.
#
# On purpose no `pnpm install` here: nothing from node_modules runs while the key is loaded.
# Setup: docs/shared-directory.md
name: Data · sign what's published

on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to sign"
        type: choice
        options: [both, directory, jobs]
        default: both
      tag:
        description: "Directory release to sign (empty: the latest)"
        type: string
        default: ""

permissions:
  contents: read

env:
  DATA_REPO: ${{ vars.DATA_REPO || 'Tanmay-Mhatre/rawjobs-directory' }}

jobs:
  directory:
    if: inputs.what != 'jobs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Never while a directory run is publishing (same group as the rebuild and contributions).
    concurrency:
      group: directory
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/catalog/sign.mjs
            packages/core/src/data-signing.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Sign the directory's manifest
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          RAWJOBS_DATA_SIGNING_KEY: ${{ secrets.RAWJOBS_DATA_SIGNING_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          tag="${TAG:-$(gh release view -R "$DATA_REPO" --json tagName -q .tagName)}"
          echo "Signing $tag"
          gh release download "$tag" -R "$DATA_REPO" -p manifest.json -D "$RUNNER_TEMP/dir"
          export RAWJOBS_DATA_PUBLIC_KEY="$(grep -o 'DATA_PUBLIC_KEY = "[^"]*"' packages/core/src/data-signing.ts | cut -d'"' -f2)"
          node scripts/catalog/sign.mjs "$RUNNER_TEMP/dir/manifest.json"
          gh release upload "$tag" "$RUNNER_TEMP/dir/manifest.json.sig" -R "$DATA_REPO" --clobber
          echo "Signed manifest.json of $tag" >> "$GITHUB_STEP_SUMMARY"

  jobs:
    if: inputs.what != 'directory'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Never while the daily feed is publishing (same group as the feed workflow).
    concurrency:
      group: jobs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/catalog/sign.mjs
            packages/core/src/data-signing.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Sign the job feed's manifests
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          RAWJOBS_DATA_SIGNING_KEY: ${{ secrets.RAWJOBS_DATA_SIGNING_KEY }}
        run: |
          gh release download jobs -R "$DATA_REPO" -p jobs-manifest.json -p jobs-v2-manifest.json -D "$RUNNER_TEMP/jobs"
          export RAWJOBS_DATA_PUBLIC_KEY="$(grep -o 'DATA_PUBLIC_KEY = "[^"]*"' packages/core/src/data-signing.ts | cut -d'"' -f2)"
          node scripts/catalog/sign.mjs "$RUNNER_TEMP/jobs/jobs-manifest.json" "$RUNNER_TEMP/jobs/jobs-v2-manifest.json"
          gh release upload jobs "$RUNNER_TEMP/jobs/jobs-manifest.json.sig" "$RUNNER_TEMP/jobs/jobs-v2-manifest.json.sig" -R "$DATA_REPO" --clobber
          echo "Signed the job feed's manifests" >> "$GITHUB_STEP_SUMMARY"
