name: Site
# Runs the scheduler Worker starts are named so; empty means GitHub's usual name.
run-name: ${{ inputs.source == 'scheduler' && format('{0} · scheduler', github.workflow) || '' }}

# Builds apps/site and deploys it to Cloudflare (Worker "www", static assets only).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers"
# permission) and CLOUDFLARE_ACCOUNT_ID. Optional: the SITE_URL variable (once a custom domain is
# connected) and CF_ANALYTICS_TOKEN (Cloudflare Web Analytics site token), as a variable or a secret.

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - apps/web/src/design/**
      - design/components/bundle.css
      # The key directory's signer (apps/site/worker.ts imports it).
      - scripts/catalog/lib/web-bot-auth.ts
      # Files build.mjs reads its lists from (hiring systems, job boards, their names): a change or
      # a move there must build the site on its own pull request, not fail the deploy after a release.
      - packages/core/src/schema.ts
      - packages/core/src/directory-search.ts
      - .github/workflows/site.yml
  pull_request:
    paths:
      - apps/site/**
      - apps/web/src/design/**
      - design/components/bundle.css
      # The key directory's signer (apps/site/worker.ts imports it).
      - scripts/catalog/lib/web-bot-auth.ts
      # Files build.mjs reads its lists from (hiring systems, job boards, their names): a change or
      # a move there must build the site on its own pull request, not fail the deploy after a release.
      - packages/core/src/schema.ts
      - packages/core/src/directory-search.ts
      - .github/workflows/site.yml
  # The weekly rebuild starts a deploy when it publishes; this Monday run is the backup, off the
  # hour (GitHub's busiest time) and well after the rebuild's usual finish.
  schedule:
    - cron: "47 13 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this run (the scheduler Worker sends scheduler)"
        type: string
        default: manual

permissions:
  contents: read

# Pull-request builds get their own group (a newer push cancels the older build), so they can never
# replace a deploy that's waiting in site-deploy; PR builds don't deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.event.pull_request.number) || 'site-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub's cron starts runs late, and a slot can get two triggers (it and the scheduler Worker):
  # a scheduled run whose slot another run already covers does nothing. Other runs always go ahead.
  covered:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/catalog/slot-covered.mjs
            .github/workflows/site.yml
          sparse-checkout-cone-mode: false
      - id: check
        name: Is this slot already covered?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          out=$(node scripts/catalog/slot-covered.mjs .github/workflows/site.yml runs)
          echo "$out"
          if grep -q '^covered=true' <<< "$out"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: another run already covers this schedule slot."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: covered
    if: needs.covered.outputs.run == 'true'
    # The Cloudflare secrets live in the `cloudflare` environment, which only main may use; pull
    # requests and branch runs get no environment, so they build but never deploy.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'cloudflare' || '' }}
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The "Site deploy failed" issue (last step).
      issues: write
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        run: node apps/site/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DATA_REPO: ${{ vars.DATA_REPO }}
          # The update beacon (v1/latest.json) reads the app's releases; a deploy must never drop it.
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_BEACON: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN || secrets.CF_ANALYTICS_TOKEN }}
      - name: Deploy to Cloudflare
        id: deploy
        # Skipped (not failed) until the two Cloudflare secrets are added.
        if: github.event_name != 'pull_request' && env.HAS_CF_TOKEN == 'true'
        # npx, not cloudflare/wrangler-action: the action installs wrangler with `npm i`, which fails
        # on the root package.json's workspace:* dependencies (EUNSUPPORTEDPROTOCOL).
        # Same wrangler version as services/contribute/package.json (Dependabot bumps that one).
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.1 deploy
      - name: Check the update beacon is live
        # Installed apps read it to find updates (BEACON_URL in packages/core/src/update.ts).
        if: steps.deploy.outcome == 'success'
        run: curl -fsS --retry 3 --retry-delay 10 --retry-all-errors https://www.rawjobs.workers.dev/v1/latest.json | jq -e .stable.version
      - name: Report a failed deploy
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create site-deploy-failed --color B60205 --description "The site deploy failed" --force > /dev/null
          open="$(gh issue list --label site-deploy-failed --state open --json number -q '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh issue create --label site-deploy-failed --title "Site deploy failed" \
              --body "The site workflow failed to build, deploy or serve the update beacon (v1/latest.json): $RUN_URL. Installed apps read the beacon to find new versions."
          fi
