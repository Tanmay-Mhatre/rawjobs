name: Site

# Builds apps/site and deploys it to Cloudflare (Worker "www", static assets only).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers"
# permission) and CLOUDFLARE_ACCOUNT_ID. Optional: the SITE_URL variable (once a custom domain is
# connected) and CF_ANALYTICS_TOKEN (Cloudflare Web Analytics site token), as a variable or a secret.

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - apps/web/src/design/**
      - design/components/bundle.css
      - .github/workflows/site.yml
  pull_request:
    paths:
      - apps/site/**
      - apps/web/src/design/**
      - design/components/bundle.css
      - .github/workflows/site.yml
  # Mondays, after the weekly directory rebuild (03:00), so the page's numbers stay current.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        run: node apps/site/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DATA_REPO: ${{ vars.DATA_REPO }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN || secrets.CF_ANALYTICS_TOKEN }}
      - name: Deploy to Cloudflare
        # Skipped (not failed) until the two Cloudflare secrets are added.
        if: github.event_name != 'pull_request' && env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          wranglerVersion: "4.147.0"
          command: deploy
