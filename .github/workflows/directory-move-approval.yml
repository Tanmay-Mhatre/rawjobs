# A maintainer approves a moved careers page: the `move-approved` label on a "Move review: …"
# issue (opened by the contributions workflow, scripts/catalog/moves.ts).
#
# Safe by construction (scripts/catalog/moves-approve.ts):
#   - the label counts only if the person who added it has maintain or admin access (asked of the API);
#   - the move is read from moves-pending.json in the directory repo by issue number, never from the
#     issue's title or body (the body only picks a candidate, by an id computed from that file);
#   - every value reaches the scripts through env:, never through ${{ }} inside run:;
#   - every gate runs again, with fresh checks, before moves.json changes.
# Approved: moves.json is committed, the issue gets a comment and is closed. Refused: a comment says
# why and the label comes off. Apps get the move with the next directory release.
# Setup: docs/shared-directory.md ("Moved careers pages").
name: Directory · approve a move

on:
  issues:
    types: [labeled]

# One approval at a time; separate from the "directory" group so it never waits behind a rebuild.
# The contributions run may also write moves.json (auto-accept): both rebase before pushing, and
# moves-lint.ts refuses two active moves for one old board after the rebase.
concurrency:
  group: directory-move-approval
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  DATA_REPO: ${{ vars.DATA_REPO || 'Tanmay-Mhatre/rawjobs-directory' }}

jobs:
  approve:
    if: github.event.label.name == 'move-approved' && startsWith(github.event.issue.title, 'Move review:')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Who added the label?
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        # A quick first check, so nothing is installed for a label from anyone else. moves-approve.ts checks again.
        run: |
          role=$(gh api "repos/$REPO/collaborators/$SENDER/permission" -q '.role_name' 2>/dev/null || echo none)
          case "$role" in
            admin|maintain) echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "The label was added by someone without maintain or admin access ($role): ignored." ;;
          esac

      - if: steps.who.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: steps.who.outputs.ok == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.who.outputs.ok == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - if: steps.who.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.who.outputs.ok == 'true'
        name: Check out the public directory repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: directory-repo

      - if: steps.who.outputs.ok == 'true'
        name: Check the move again
        id: decide
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          ISSUES_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SENDER: ${{ github.event.sender.login }}
          DENYLIST_FILE: ${{ github.workspace }}/directory-repo/denylist.json
        run: |
          gh release download -R "$DATA_REPO" -p directory.json.gz -O "$RUNNER_TEMP/live-directory.json.gz" --clobber
          gunzip -c "$RUNNER_TEMP/live-directory.json.gz" > "$RUNNER_TEMP/live-directory.json"
          GH_TOKEN="$ISSUES_TOKEN" pnpm exec tsx scripts/catalog/moves-approve.ts --dir directory-repo --directory "$RUNNER_TEMP/live-directory.json" --out "$RUNNER_TEMP/approval.json"
          echo "action=$(jq -r .action "$RUNNER_TEMP/approval.json")" >> "$GITHUB_OUTPUT"
          jq -r '.comment // ""' "$RUNNER_TEMP/approval.json" > "$RUNNER_TEMP/comment.md"

      - if: steps.decide.outputs.action == 'approve'
        name: Commit moves.json
        working-directory: directory-repo
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "rawjobs-bot"
          git config user.email "rawjobs-bot@users.noreply.github.com"
          git add moves.json
          git commit -m "Approve a move (code repo issue #$ISSUE_NUMBER)"
          for try in 1 2 3; do
            if git pull --rebase --quiet; then
              (cd .. && pnpm exec tsx scripts/catalog/moves-lint.ts directory-repo/moves.json) || exit 1
              git push && exit 0
            fi
            sleep $((try * 5))
          done
          exit 1

      - if: steps.decide.outputs.action == 'approve'
        name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" -R "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$ISSUE_NUMBER" -R "$REPO" --reason completed

      - if: steps.decide.outputs.action == 'refuse'
        name: Say why it wasn't approved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" -R "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE_NUMBER" -R "$REPO" --remove-label move-approved
