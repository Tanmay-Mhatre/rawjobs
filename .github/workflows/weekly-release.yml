name: Weekly release

# Once a week, release what was merged since the last release, so the many PRs of a week reach people
# as one update (merging a PR never releases anything by itself). Skipped when nothing was merged or
# main's checks aren't green. The version is the last release's with the patch number + 1, or
# package.json's when that's newer (bump it there for a minor or major release).
#
# Run it by hand (Actions → Weekly release → Run workflow) to release now; tick "mandatory" for a
# fix everyone must install: the dashboard then asks in a window that only closes by updating.
# A tag pushed by hand (git tag -a v0.5.1) releases the same way, through release.yml.
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mandatory:
        description: A required update (everyone is asked to install it)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: The next version, if there's anything to release
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          MANDATORY: ${{ inputs.mandatory }}
        run: |
          set -eu
          last="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$last" ] && [ "$(git rev-list --count "$last"..HEAD)" = 0 ]; then
            echo "Nothing merged since $last: no release this week."
            exit 0
          fi
          sha="$(git rev-parse HEAD)"
          ci="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$sha" --json conclusion --jq '.[0].conclusion // ""')"
          if [ "$ci" != success ]; then
            echo "::warning::main's checks for $sha aren't green (${ci:-not run}): no release this week."
            exit 0
          fi
          pkg="$(node -p 'require("./package.json").version')"
          if [ -z "$last" ]; then next="$pkg"
          else
            v="${last#v}"
            next="${v%.*}.$((${v##*.} + 1))"
            # A newer version in package.json (a minor or major release) wins.
            if [ "$(printf '%s\n%s\n' "$next" "$pkg" | sort -V | tail -n 1)" = "$pkg" ] && [ "$pkg" != "$next" ]; then next="$pkg"; fi
          fi
          {
            echo "RawJobs $next"
            echo
            if [ -n "$last" ]; then
              # Merge commits carry the PR's title in their body; dependency bumps become one line.
              changes="$(git log --merges --format='%b' "$last"..HEAD | sed '/^\s*$/d')"
              echo "$changes" | grep -viE '^bump ' | sed 's/^/- /' || true
              if echo "$changes" | grep -qiE '^bump '; then echo "- Dependency updates"; fi
            fi
            if [ "$MANDATORY" = true ]; then echo; echo "Update: mandatory"; fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$next" -F "$RUNNER_TEMP/notes.md"
          git push origin "v$next"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

  # A tag pushed with the workflow's own token doesn't start release.yml by itself: call it.
  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
