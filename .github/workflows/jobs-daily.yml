# Every day: read every live directory board's open jobs once, for everyone, and publish them as the
# shared job feed (the "jobs" release of the directory repo). Scans use it to skip companies with
# nothing for the user and still fetch the rest live. Unchanged boards cost an empty 304.
# Setup: docs/shared-directory.md ("Job feed")
name: Jobs · daily feed

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

# Its own group: the feed keeps its own state, so it never waits for or blocks the directory runs.
concurrency:
  group: jobs
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

env:
  DATA_REPO: ${{ vars.DATA_REPO || 'Tanmay-Mhatre/rawjobs-directory' }}

jobs:
  feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore yesterday's feed and ETags
        id: state
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh restore jobs

      - name: Get the directory and the denylist
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          gh release download -R "$DATA_REPO" -p directory.json.gz -D "$RUNNER_TEMP"
          gunzip -c "$RUNNER_TEMP/directory.json.gz" > "$RUNNER_TEMP/directory.json"
          if ! gh api "repos/$DATA_REPO/contents/denylist.json" -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/denylist.json" 2> "$RUNNER_TEMP/denylist.err"; then
            grep -qi "not found" "$RUNNER_TEMP/denylist.err" || { cat "$RUNNER_TEMP/denylist.err"; exit 1; }
            echo '{"companies":[]}' > "$RUNNER_TEMP/denylist.json"
          fi

      - name: Build the feed
        env:
          DENYLIST_FILE: ${{ runner.temp }}/denylist.json
        # Stops starting boards after 5 h so the publish and save steps always get to run.
        run: pnpm exec tsx scripts/catalog/jobs.ts --directory "$RUNNER_TEMP/directory.json" --out scripts/catalog/out/jobs --max-minutes 300

      - name: Sign the manifest
        timeout-minutes: 2
        env:
          RAWJOBS_DATA_SIGNING_KEY: ${{ secrets.RAWJOBS_DATA_SIGNING_KEY }}
        # Apps accept the data only with a valid signature (packages/core/src/data-signing.ts).
        run: |
          export RAWJOBS_DATA_PUBLIC_KEY="$(grep -o 'DATA_PUBLIC_KEY = "[^"]*"' packages/core/src/data-signing.ts | cut -d'"' -f2)"
          node scripts/catalog/sign.mjs scripts/catalog/out/jobs/jobs-manifest.json scripts/catalog/out/jobs/jobs-v2-manifest.json

      - name: Publish (shards first, manifest last)
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        working-directory: scripts/catalog/out/jobs
        run: |
          # Not --latest: the directory download uses releases/latest.
          gh release view jobs -R "$DATA_REPO" > /dev/null 2>&1 ||
            gh release create jobs -R "$DATA_REPO" --latest=false --title "Job feed" \
              --notes "The shared job feed, rebuilt daily. Read jobs-manifest.json first; shards are checked against its SHA-256."
          # First format: one shard per hiring system. Second: today's full copy and change file.
          shards=$(jq -r '.shards[].file' jobs-manifest.json)
          v2new=$(ls jobs-v2-snapshot-*.json.br jobs-v2-diff-*.json.br 2> /dev/null || true)
          gh release upload jobs $shards $v2new -R "$DATA_REPO" --clobber
          # Each manifest together with its signature, so the pair changes as close to together as it can.
          gh release upload jobs jobs-manifest.json jobs-manifest.json.sig -R "$DATA_REPO" --clobber
          gh release upload jobs jobs-v2-manifest.json jobs-v2-manifest.json.sig -R "$DATA_REPO" --clobber
          # Drop files no manifest points to any more (the second keeps 14 days of change files).
          keep=$(printf '%s\n' $shards jobs-manifest.json jobs-manifest.json.sig jobs-v2-manifest.json jobs-v2-manifest.json.sig $(jq -r '.snapshot.file, .diffs[].file' jobs-v2-manifest.json))
          for a in $(gh release view jobs -R "$DATA_REPO" --json assets -q '.assets[].name'); do
            grep -qx "$a" <<< "$keep" || gh release delete-asset jobs "$a" -R "$DATA_REPO" -y
          done
          jq '{generated_at, alerts, http, ats, v2}' stats.json

      - name: Save the feed and ETags for tomorrow
        if: always() && steps.state.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/catalog/state.sh save jobs

      - name: Flag a large change since yesterday
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alerts=$(jq -r '.alerts | join("; ")' scripts/catalog/out/jobs/stats.json)
          [ -n "$alerts" ] || exit 0
          title="Job feed changed a lot: $(date -u +%Y-%m-%d)"
          gh issue create -R "${{ github.repository }}" --title "$title" \
            --body "The daily job feed moved more than 20% since yesterday ($alerts). A connector may be broken or a host may be blocking the runner. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Job feed run failed"
          if [ -z "$(gh issue list -R "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
            gh issue create -R "${{ github.repository }}" --title "$title" \
              --body "The daily job feed failed. Scans fall back to fetching every company live until it runs again. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Check the directory isn't stale
        # The weekly rebuild publishes a dated release (directory-YYYY-MM-DD); contributions publish
        # "-shared" ones in between, which don't count. More than 8 days old means a rebuild went missing.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(bash scripts/catalog/watchdog.sh latest)
          # None found counts as stale (an empty date would read as today and never alert).
          if [ -n "$published" ]; then
            age_days=$(( ( $(date -u +%s) - $(date -u -d "$published" +%s) ) / 86400 ))
            echo "Latest directory release: $published ($age_days days old)"
            [ "$age_days" -gt 8 ] || exit 0
            what="The latest directory release is $age_days days old (published $published)"
          else
            echo "No weekly directory release found."
            what="No weekly directory release (directory-YYYY-MM-DD) was found"
          fi
          title="Directory is stale"
          if [ -z "$(gh issue list -R "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
            gh issue create -R "${{ github.repository }}" --title "$title" --body "$what; the weekly rebuild should publish one every Monday. Check the Directory · weekly rebuild runs: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/directory-rebuild.yml"
          fi

      - name: Start the weekly rebuild if it's overdue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/catalog/watchdog.sh rebuild

      - name: Keep the schedules alive
        # GitHub turns off scheduled workflows after 60 days without repository activity.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/catalog/watchdog.sh keepalive
