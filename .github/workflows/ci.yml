name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older runs (the install test alone is three machines).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Design tokens, design lint, typecheck and tests: the same gate as a release and the pre-push hook.
      - run: pnpm check
        timeout-minutes: 5
      - name: Example config is valid
        run: pnpm rawjobs validate --config rawjobs.config.example.yaml
      - name: The bundle runs through its launcher (an installed copy, without pnpm or tsx)
        run: |
          pnpm bundle --try "$RUNNER_TEMP/rawjobs"
          cd "$RUNNER_TEMP"
          rawjobs/bin/rawjobs --help
          rawjobs/bin/rawjobs validate --config "$GITHUB_WORKSPACE/rawjobs.config.example.yaml"
          rawjobs/bin/rawjobs setup status | grep -F "\"configPath\":\"$RUNNER_TEMP/rawjobs/rawjobs.config.local.yaml\""
          rawjobs/bin/rawjobs serve --port 4399 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:4399/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:4399/api/health | grep -F '"ok":true'
          curl -fs http://127.0.0.1:4399/ | grep -qi "<!doctype html>"
          curl -fs http://127.0.0.1:4399/api/setup | grep -F '"isPersonal":false'
          kill $!

  # The oldest Node the app supports (package.json engines; the data workflows run on it too).
  # A job of its own, not a matrix: branch protection requires the check above by name.
  node-22:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        timeout-minutes: 5

  # Release files like a real release's, signed with a key made for this run (the real one stays
  # with releases), for the install test below. On a push to main its steps are skipped and the job
  # still succeeds: the same tree was tested on its pull request, and a release reruns the install test.
  release-files:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      public-key: ${{ steps.key.outputs.public-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: github.event_name != 'push'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'push'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'push'
      - name: A throwaway signing key
        if: github.event_name != 'push'
        id: key
        run: |
          node -e '
            const { generateKeyPairSync } = require("node:crypto");
            const fs = require("node:fs");
            const { publicKey, privateKey } = generateKeyPairSync("ed25519");
            fs.writeFileSync(process.env.RUNNER_TEMP + "/key.pem", privateKey.export({ type: "pkcs8", format: "pem" }));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "public-key=" + publicKey.export({ type: "spki", format: "der" }).toString("base64") + "\n");
          '
      - name: This version's release, a newer one and a broken one (for the update test)
        if: github.event_name != 'push'
        run: |
          v="$(node -p 'require("./package.json").version')"
          bump() { node -p "const [a,b,c]='$v'.split('.').map(Number); [a,b,c+$1].join('.')"; }
          # Built unsigned, then signed by sign.mjs: the same two steps as the release workflow.
          sign() { RAWJOBS_SIGNING_KEY="$(cat "$RUNNER_TEMP/key.pem")" node scripts/catalog/sign.mjs --key-env RAWJOBS_SIGNING_KEY --public-key "${{ steps.key.outputs.public-key }}" "$1/latest.json"; }
          pnpm bundle
          pnpm release:files --unsigned && sign dist/release
          echo "A newer version, for the update test." > "$RUNNER_TEMP/notes.md"
          pnpm bundle --skip-web --version "$(bump 1)"
          pnpm release:files --unsigned --version "$(bump 1)" --notes-file "$RUNNER_TEMP/notes.md" --out dist/release/next && sign dist/release/next
          pnpm bundle --skip-web --version "$(bump 2)" --broken
          pnpm release:files --unsigned --version "$(bump 2)" --out dist/release/broken && sign dist/release/broken
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'push'
        with:
          name: release-test
          path: dist/release
          if-no-files-found: error
          retention-days: 3

  install:
    needs: release-files
    uses: ./.github/workflows/install-test.yml
    with:
      artifact: release-test
      public-key: ${{ needs.release-files.outputs.public-key }}
      update-test: true
      # Pushes to main report the install checks as passed without running them (see release-files).
      skip: ${{ github.event_name == 'push' }}
