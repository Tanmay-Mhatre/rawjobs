name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older runs (the install test alone is three machines).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dependabot pull requests: every version the lockfile adds is at least 7 days old, so a bad
      # release pulled within days never merges. Checks Dependabot's pnpm honoured minimumReleaseAge.
      - name: New package versions are at least a week old
        if: startsWith(github.head_ref, 'dependabot/')
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:pnpm-lock.yaml > "$RUNNER_TEMP/base-lock.yaml"
          pnpm exec tsx scripts/ci/lockfile-age.ts "$RUNNER_TEMP/base-lock.yaml" pnpm-lock.yaml
      # Design tokens, design lint, typecheck and tests: the same gate as a release and the pre-push hook.
      - run: pnpm check
        timeout-minutes: 5
      - name: Example config is valid
        run: pnpm rawjobs validate --config rawjobs.config.example.yaml
      - name: The bundle runs through its launcher (an installed copy, without pnpm or tsx)
        run: |
          pnpm bundle --try "$RUNNER_TEMP/rawjobs"
          cd "$RUNNER_TEMP"
          rawjobs/bin/rawjobs --help
          rawjobs/bin/rawjobs validate --config "$GITHUB_WORKSPACE/rawjobs.config.example.yaml"
          rawjobs/bin/rawjobs setup status | grep -F "\"configPath\":\"$RUNNER_TEMP/rawjobs/rawjobs.config.local.yaml\""
          rawjobs/bin/rawjobs serve --port 4399 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:4399/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:4399/api/health | grep -F '"ok":true'
          curl -fs http://127.0.0.1:4399/ | grep -qi "<!doctype html>"
          curl -fs http://127.0.0.1:4399/api/setup | grep -F '"isPersonal":false'
          kill $!

  # The oldest Node the app supports (package.json engines; the data workflows run on it too).
  # A job of its own, not a matrix: branch protection requires the check above by name.
  node-22:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        timeout-minutes: 5

  # Every dashboard screen in light and dark, at desktop and phone width, through axe (WCAG 2.1 AA and
  # best practices) in the runner's Edge, on demo data. Fails on a screen that breaks or any
  # violation; the screenshots and axe-report.md are kept as an artifact. A pull request that changes
  # nothing the dashboard is built from passes at once, so the check can be required.
  a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out GitHub's merge commit: its first parent is the base branch.
          fetch-depth: 2
      - name: Does this change the dashboard?
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -qE '^(apps/web/|design/|scripts/design/|package\.json$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped: this pull request changes nothing the dashboard is built from."
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changed.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changed.outputs.run == 'true'
      - run: pnpm design:shots --axe --out "$RUNNER_TEMP/shots"
        if: steps.changed.outputs.run == 'true'
        timeout-minutes: 20
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        with:
          name: shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7

  # End-to-end smoke test: the real server on a seeded RawJobs folder, driven in the runner's Edge
  # (scripts/e2e/smoke.ts): first-run setup, Radar, saving a job to Pipeline and to disk, Companies,
  # the version. A pull request that changes none of the app's code passes at once.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out GitHub's merge commit: its first parent is the base branch.
          fetch-depth: 2
      - name: Does this change the app?
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -qE '^(apps/web/|packages/|design/|scripts/e2e/|scripts/design/demo-data\.ts$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped: this pull request changes none of the app's code."
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changed.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changed.outputs.run == 'true'
      - run: pnpm build
        if: steps.changed.outputs.run == 'true'
      - run: pnpm e2e:smoke
        if: steps.changed.outputs.run == 'true'
        timeout-minutes: 5

  # Release files like a real release's, signed with a key made for this run (the real one stays
  # with releases), for the install test below. On a push to main its steps are skipped and the job
  # still succeeds: the same tree was tested on its pull request, and a release reruns the install test.
  release-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      public-key: ${{ steps.key.outputs.public-key }}
      skip-macos: ${{ steps.macos.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge commit and its first parent (main), to list the changed files.
          fetch-depth: 2
      # GitHub has too few macOS runners: a macOS job that waits about 15 minutes for one is cancelled
      # ("not acquired by Runner"), and every pull request asked for one. So a pull request runs the
      # macOS install test only when it changes files the install, update or desktop app depend on;
      # Linux and Windows still run it every time, and a release always runs all three.
      - name: Does this pull request need the macOS install test?
        if: github.event_name == 'pull_request'
        id: macos
        run: |
          if ! changed="$(git diff --name-only HEAD^1 HEAD)"; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$changed"
          if echo "$changed" | grep -qE '^(packaging/|scripts/bundle/|scripts/release/|\.github/workflows/(ci|install-test|release)\.yml$|package\.json$|pnpm-lock\.yaml$|packages/core/src/(release|update|schedule)\.ts$|packages/server/src/(desktop|icon|private-home|serve|shortcuts)\.ts$)'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "No install, update or desktop files changed: the macOS install test reports passed without running."
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: github.event_name != 'push'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'push'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'push'
      - name: A throwaway signing key
        if: github.event_name != 'push'
        id: key
        run: |
          node -e '
            const { generateKeyPairSync } = require("node:crypto");
            const fs = require("node:fs");
            const { publicKey, privateKey } = generateKeyPairSync("ed25519");
            fs.writeFileSync(process.env.RUNNER_TEMP + "/key.pem", privateKey.export({ type: "pkcs8", format: "pem" }));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "public-key=" + publicKey.export({ type: "spki", format: "der" }).toString("base64") + "\n");
          '
      - name: This version's release, a newer one and a broken one (for the update test)
        if: github.event_name != 'push'
        run: |
          v="$(node -p 'require("./package.json").version')"
          bump() { node -p "const [a,b,c]='$v'.split('.').map(Number); [a,b,c+$1].join('.')"; }
          # Built unsigned, then signed by sign.mjs: the same two steps as the release workflow.
          sign() { RAWJOBS_SIGNING_KEY="$(cat "$RUNNER_TEMP/key.pem")" node scripts/catalog/sign.mjs --key-env RAWJOBS_SIGNING_KEY --public-key "${{ steps.key.outputs.public-key }}" "$1/latest.json"; }
          pnpm bundle
          pnpm release:files --unsigned && sign dist/release
          echo "A newer version, for the update test." > "$RUNNER_TEMP/notes.md"
          pnpm bundle --skip-web --version "$(bump 1)"
          pnpm release:files --unsigned --version "$(bump 1)" --notes-file "$RUNNER_TEMP/notes.md" --out dist/release/next && sign dist/release/next
          pnpm bundle --skip-web --version "$(bump 2)" --broken
          pnpm release:files --unsigned --version "$(bump 2)" --out dist/release/broken && sign dist/release/broken
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'push'
        with:
          name: release-test
          path: dist/release
          if-no-files-found: error
          retention-days: 3

  install:
    needs: release-files
    uses: ./.github/workflows/install-test.yml
    with:
      artifact: release-test
      public-key: ${{ needs.release-files.outputs.public-key }}
      update-test: true
      # Pushes to main report the install checks as passed without running them (see release-files).
      skip: ${{ github.event_name == 'push' }}
      skip-macos: ${{ needs.release-files.outputs.skip-macos == 'true' }}
