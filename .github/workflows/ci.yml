name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Example config is valid
        run: pnpm rawjobs validate --config rawjobs.config.example.yaml
      - name: The bundle runs through its launcher (an installed copy, without pnpm or tsx)
        run: |
          pnpm bundle --try "$RUNNER_TEMP/rawjobs"
          cd "$RUNNER_TEMP"
          rawjobs/bin/rawjobs --help
          rawjobs/bin/rawjobs validate --config "$GITHUB_WORKSPACE/rawjobs.config.example.yaml"
          rawjobs/bin/rawjobs setup status | grep -F "\"configPath\":\"$RUNNER_TEMP/rawjobs/rawjobs.config.local.yaml\""
          rawjobs/bin/rawjobs serve --port 4399 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:4399/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:4399/api/health | grep -F '"ok":true'
          curl -fs http://127.0.0.1:4399/ | grep -qi "<!doctype html>"
          curl -fs http://127.0.0.1:4399/api/setup | grep -F '"isPersonal":false'
          kill $!

  # Release files like a real release's, signed with a key made for this run (the real one stays
  # with releases), for the install test below.
  release-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      public-key: ${{ steps.key.outputs.public-key }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: A throwaway signing key
        id: key
        run: |
          node -e '
            const { generateKeyPairSync } = require("node:crypto");
            const fs = require("node:fs");
            const { publicKey, privateKey } = generateKeyPairSync("ed25519");
            fs.writeFileSync(process.env.RUNNER_TEMP + "/key.pem", privateKey.export({ type: "pkcs8", format: "pem" }));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "public-key=" + publicKey.export({ type: "spki", format: "der" }).toString("base64") + "\n");
          '
      - name: This version's release, a newer one and a broken one (for the update test)
        run: |
          key=(--key "$RUNNER_TEMP/key.pem" --public-key "${{ steps.key.outputs.public-key }}")
          v="$(node -p 'require("./package.json").version')"
          bump() { node -p "const [a,b,c]='$v'.split('.').map(Number); [a,b,c+$1].join('.')"; }
          pnpm bundle
          pnpm release:files "${key[@]}"
          echo "A newer version, for the update test." > "$RUNNER_TEMP/notes.md"
          pnpm bundle --skip-web --version "$(bump 1)"
          pnpm release:files "${key[@]}" --version "$(bump 1)" --notes-file "$RUNNER_TEMP/notes.md" --out dist/release/next
          pnpm bundle --skip-web --version "$(bump 2)" --broken
          pnpm release:files "${key[@]}" --version "$(bump 2)" --out dist/release/broken
      - uses: actions/upload-artifact@v7
        with:
          name: release-test
          path: dist/release
          if-no-files-found: error
          retention-days: 3

  install:
    needs: release-files
    uses: ./.github/workflows/install-test.yml
    with:
      artifact: release-test
      public-key: ${{ needs.release-files.outputs.public-key }}
      update-test: true
