# Keeps the pinned actions (full commit SHAs) and the npm packages current: one grouped pull
# request a week per ecosystem, which goes through CI like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # The types follow the Node that installed copies run (the bundled runtime, Node 24) and the
      # data workflows (22), so code can't type-check against features that crash there. They move
      # up together with the bundled runtime, by hand; minor and patch updates still come.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Big upgrades done on purpose, in their own pull request, not as a weekly bump: the test
      # runner (config and APIs change between majors) and the compiler (TypeScript 7 is the native one).
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
