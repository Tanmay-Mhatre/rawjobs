# Example RawJobs config. Setup writes your own to rawjobs.config.local.yaml (gitignored);
# or copy this file there and edit it. Your config is personal: it never goes in git.
# Secrets (Telegram token, etc.) never go in any config file.
# Check it with:  pnpm rawjobs validate

profile:
  name: "Product manager, London + remote"

  titles:
    # A job's title must contain one of these (whole words, case-insensitive)...
    include: ["product manager", "head of product", "product lead", "group product", "director of product"]
    # ...and none of these.
    exclude: ["associate", "intern", "product marketing", "product designer", "junior"]

  # +10 points when the title contains one of these or is at the level they name
  # (senior; principal/staff/lead; head/director/vp), +5 when it's one level away.
  seniority_boost: ["senior", "lead", "principal", "head", "director", "staff", "group"]

  locations:
    # +20: the job is in one of these places.
    include: ["london", "united kingdom", "uk"]
    # +15: remote roles you can take from where you live...
    remote_ok: ["emea", "europe", "remote"]
    # ...unless the location also names a region you can't work from (e.g. "Remote (US)").
    remote_exclude: ["us", "usa", "united states", "canada", "americas", "latam", "apac"]

  # Industries you want to work in: jobs at companies in them rank higher (up to +10), and those
  # companies are suggested first. They don't decide what a scan fetches.
  # Ids: crypto, crypto-exchange, brokerage, trading-tech, payments, digital-bank, … (see the setup's Industries step)
  industries: ["payments"]

  # Topics, matched as whole words in the title and description. Weight 1 (nice) to 5 (core).
  # Up to 40 points: 40 × matched weight ÷ min(total weight, 12), so about three core topics fill
  # the bar. See "How scoring works" in README.md.
  keywords:
    payments: 5
    fintech: 4
    api: 3
    platform: 3
    b2b: 2
    compliance: 1

  # Jobs scoring at least this are strong matches: highlighted on the Radar and counted as
  # strong fits in Telegram alerts.
  min_score: 70

# One line per company. Get these lines from careers URLs with:
#   pnpm rawjobs detect https://jobs.lever.co/somecompany
companies:
  - { name: "Stripe", ats: greenhouse, slug: "stripe" }
  - { name: "Palantir", ats: lever, slug: "palantir" }
  - { name: "Ramp", ats: ashby, slug: "ramp" }

# Set up Telegram in the dashboard (Settings → Notifications), or with `pnpm rawjobs alerts telegram`.
# The bot token and chat id go in profile/secrets.json (or TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID), never here.
alerts:
  telegram: false
  email: false # not used yet
  only_new: true # scheduled scans send only jobs you haven't been sent before
