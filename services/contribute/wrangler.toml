# RawJobs contribution inbox. Setup steps: docs/shared-directory.md (forks: docs/self-hosting.md)
name = "rawjobs-contribute"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Waiting contributions (kept 30 days at most). Create it with:
#   npx wrangler kv namespace create INBOX
# and paste the id it prints below.
[[kv_namespaces]]
binding = "INBOX"
id = "4f1d60f6a7644dfe9a93db87c9560fd0"

# 20 submissions per minute per IP address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Most boards accepted per day (UTC), for everyone together. Over it, apps keep their boards and
# retry later. Each accepted request costs 2 KV writes (free plan: 1,000 writes a day).
[vars]
DAILY_CAP = "2000"
# Most new move reports (POST /v1/moves) stored per day (UTC), for everyone together. Each new one
# costs 2 KV writes, a new reporter on a known one costs 1.
MOVES_DAILY_CAP = "100"

# Secrets (not in this file):
#   INBOX_TOKEN, shared with the GitHub workflow:
#     npx wrangler secret put INBOX_TOKEN
#   REPORTER_SECRET, a long random string that keys the reporter hashes on move reports (never
#   shared; without it /v1/moves answers 503):
#     npx wrangler secret put REPORTER_SECRET
