packages:
  - "packages/*"
  - "apps/*"
  - "services/contribute"

# The Node types follow the Node that installed copies run (the bundled runtime, 24), for every
# package, so no tool pulls in newer ones. They move together with the @types/node rule in
# .github/dependabot.yml and the bundled runtime (scripts/release/manifest.ts).
overrides:
  "@types/node": "^24.19.2"

onlyBuiltDependencies:
  - esbuild
  - workerd

# Don't resolve a version published less than 7 days ago (in minutes), the same week as Dependabot's
# cooldown. For an urgent fix, see minimumReleaseAgeExclude in CONTRIBUTING.md.
minimumReleaseAge: 10080
# Refuse a version whose publish trust went down (for example, no provenance where earlier ones had it).
trustPolicy: no-downgrade
